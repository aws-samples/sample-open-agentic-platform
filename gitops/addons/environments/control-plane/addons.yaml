useSelectors: true

# AgentCore (Crossplane compositions)
crossplane-agentcore:
  enabled: true

# Observability
langfuse:
  enabled: true
jaeger:
  enabled: false
otel-collector:
  enabled: true
prometheus-operator-crds:
  enabled: true

# Bifrost AI Gateway
bifrost:
  enabled: true

# AgentGateway (MCP Auth via KeyCloak)
gateway-api-crds:
  enabled: true
agentgateway-crds:
  enabled: true
agentgateway:
  enabled: true
agent-gateway:
  enabled: true

# OAM Agent Components (KubeVela ComponentDefinitions for agent, mcp-server, agentcore-memory)
# KubeVela itself is provisioned by the platform (appmod-blueprints).
oam-agent-components:
  enabled: true
