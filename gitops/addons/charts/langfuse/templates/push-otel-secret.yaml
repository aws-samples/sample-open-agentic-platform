{{- if .Values.seed.enabled }}
# K8s Secret holding Langfuse OTEL API keys
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-otel-keys
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  LANGFUSE_PUBLIC_KEY: "{{ .Values.seed.apiKey.publicKey }}"
  LANGFUSE_SECRET_KEY: "{{ .Values.seed.apiKey.secretKey }}"
---
# PushSecret: syncs K8s Secret → AWS Secrets Manager
# So spoke OTel collectors can read via ExternalSecret
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: langfuse-otel-keys
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRefs:
    - name: aws-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: langfuse-otel-keys
  data:
    - conversionStrategy: None
      match:
        secretKey: LANGFUSE_PUBLIC_KEY
        remoteRef:
          remoteKey: hub/langfuse-otel
          property: LANGFUSE_PUBLIC_KEY
    - conversionStrategy: None
      match:
        secretKey: LANGFUSE_SECRET_KEY
        remoteRef:
          remoteKey: hub/langfuse-otel
          property: LANGFUSE_SECRET_KEY
{{- end }}
