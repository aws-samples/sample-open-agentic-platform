apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://langfuse:langfuse-password@langfuse-postgres:5432/langfuse"
  NEXTAUTH_SECRET: "changeme-generate-random-secret"
  SALT: "changeme-generate-salt"
  LANGFUSE_INIT_USER_EMAIL: "admin@agent-platform.local"
  LANGFUSE_INIT_USER_PASSWORD: "changeme-admin-password"
  LANGFUSE_INIT_PROJECT_NAME: "agent-platform"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-config
  namespace: {{ .Release.Namespace }}
data:
  NEXTAUTH_URL: "https://{{ .Values.ingress.host }}"
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
  NODE_ENV: "production"
  AUTH_KEYCLOAK_CLIENT_ID: "langfuse"
  AUTH_KEYCLOAK_ISSUER: "{{ .Values.keycloak.issuerUrl }}"
  AUTH_KEYCLOAK_ALLOW_ACCOUNT_LINKING: "true"
  AUTH_DISABLE_SIGNUP: "{{ .Values.keycloak.disableSignup | default "false" }}"
  # ClickHouse (required for Langfuse v3)
  CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
  CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_PASSWORD: "clickhouse"
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  # Redis (required for Langfuse v3)
  REDIS_CONNECTION_STRING: "redis://langfuse-redis:6379"
  # Blob storage — set bucket name (required by v3 Zod schema validation)
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse-events-placeholder"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "{{ .Values.global.awsRegion | default "us-east-1" }}"
  LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "false"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-postgres
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: langfuse-postgres
  replicas: 1
  # Set fields explicitly that the apiserver would otherwise default, so Argo
  # does not see drift on every reconcile.
  podManagementPolicy: OrderedReady
  revisionHistoryLimit: 10
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: langfuse-postgres
  template:
    metadata:
      labels:
        app: langfuse-postgres
    spec:
      # Pin pod-spec fields the apiserver would otherwise default, so Argo
      # does not see drift on every reconcile.
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: IfNotPresent
          # Pin defaulted container fields too.
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 70
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: langfuse
            - name: POSTGRES_USER
              value: langfuse
            - name: POSTGRES_PASSWORD
              value: langfuse-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Pin volumeMode so it matches the apiserver-defaulted live state.
        volumeMode: Filesystem
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: langfuse-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z langfuse-postgres 5432; do echo "Waiting for postgres..."; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: langfuse
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: langfuse-secrets
            - configMapRef:
                name: langfuse-config
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: AUTH_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: langfuse-keycloak-secret
                  key: LANGFUSE_CLIENT_SECRET
                  optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: langfuse
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-keycloak-secret
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  refreshInterval: "5m"
  target:
    name: langfuse-keycloak-secret
    creationPolicy: Owner
  data:
    - secretKey: LANGFUSE_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.keycloak.secretManagerKey }}
        property: LANGFUSE_CLIENT_SECRET

---
# ClickHouse (required for Langfuse v3 — OLAP storage for traces)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-clickhouse
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: langfuse-clickhouse
  replicas: 1
  podManagementPolicy: OrderedReady
  revisionHistoryLimit: 10
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: langfuse-clickhouse
  template:
    metadata:
      labels:
        app: langfuse-clickhouse
    spec:
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}
          imagePullPolicy: IfNotPresent
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8123
              name: http
              protocol: TCP
            - containerPort: 9000
              name: native
              protocol: TCP
          env:
            - name: CLICKHOUSE_DB
              value: default
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: clickhouse
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: clickhouse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: langfuse-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
  type: ClusterIP
---
# Redis (required for Langfuse v3 — queue + cache)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-redis
  template:
    metadata:
      labels:
        app: langfuse-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
          args: ["--maxmemory-policy", "noeviction"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: langfuse-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
