{{- if and .Values.microvm .Values.microvm.enabled }}
{{- /*
Flow D — MicrovmSandbox ResourceGraphDefinition (KRO).

ONE composite CRD (kro.run) that ties together ALL the Lambda MicroVM primitives so
a consumer (the lambda-microvm SandboxTemplate bridge, or any agent) creates a single
`MicrovmSandbox` and gets the whole substrate:

  MicrovmSandbox  ->  S3 Bucket        (s3.services.k8s.aws)         image codeArtifact store
                      IAM Role (build) (iam.services.k8s.aws)        MicrovmImage.buildRoleARN
                      IAM Role (exec)  (iam.services.k8s.aws)        Microvm.executionRoleARN
                      MicrovmImage     (lambdamicrovms.services.k8s.aws)  platform-owned image
                      Microvm          (lambdamicrovms.services.k8s.aws)  app-owned instance

OWNERSHIP SPLIT is expressed IN THE SCHEMA:
  spec.image.*  — PLATFORM-owned (base image, code artifact) — set once per image
  spec.run.*    — APP-owned (per-claim instance: idle policy)

NETWORK: Lambda MicroVMs have PUBLIC internet egress by DEFAULT, so no network
connectors are attached here (the coder only needs outbound git/gh/registry, like
Flow A). Ingress connectors (AWS-managed, inbound HTTPS) and VPC egress connectors
(created out-of-band via `aws lambda-core create-network-connector`) are optional
add-ons a future variant can wire in; they are intentionally omitted from v1.

CONTROLLER SPLIT: the s3/iam resources are reconciled by MANAGED ACK (GA controllers);
MicrovmImage/Microvm by the SELF-MANAGED lambdamicrovms controller (pre-GA). The RGD is
identical regardless of who runs the controllers — when lambdamicrovms goes GA and
Managed ACK adopts it, THIS FILE DOES NOT CHANGE.

Gated behind microvm.enabled so Flow D stays dormant until a cluster opts in. Requires
the Managed KRO capability (kro.run) + the ACK controllers to be present on the cluster.
*/ -}}
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: microvm-sandbox
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  schema:
    apiVersion: v1alpha1
    kind: MicrovmSandbox
    group: {{ .Values.microvm.apiGroup | default "sandbox.agents.x-k8s.io" | quote }}
    # SCOPE: this RGD builds ONLY the platform IMAGE + the slow-changing infra it
    # needs (S3 artifact bucket, build role, execution role). It deliberately does
    # NOT create a `Microvm` — a MicroVM instance is a per-SESSION, request-time
    # resource whose create/suspend/resume/terminate are IMPERATIVE SDK ops that the
    # ACK controller does not reconcile (confirmed in the lambdamicrovms-controller
    # reference: run/suspend/resume/terminate are SDK calls, not desired state, and
    # the 06-kro example likewise leaves the running Microvm out of the graph). The
    # shim (SandboxTemplate bridge + microvm-lifecycle controller, templates 51/52)
    # owns that lifecycle. So a `MicrovmSandbox` = "an image is built + ready + its
    # exec identity", and its status is the HANDOFF the shim consumes to RunMicrovm.
    spec:
      # ── PLATFORM-owned: the image / substrate (set once per image) ──────────
      # ARN of the AWS-published base MicroVM image to build from, e.g.
      # arn:aws:lambda:<region>:aws:microvm-image:al2023-1 (ARM_64 — the only arch
      # Lambda MicroVM supports).
      baseImageARN: string
      # S3 URI of the coder code artifact zip (app + Dockerfile), e.g.
      # s3://<bucket>/<key>. Lambda MicroVM's codeArtifact.uri is S3-ONLY — it is
      # NOT an ECR image reference (the Dockerfile inside the zip MAY pull private
      # ECR base layers, which is why buildRole keeps ecr:Get*/BatchGetImage). The
      # artifact must be published to the bucket before the first build runs.
      codeArtifactUri: string
      # AWS region + a name stem for the created resources.
      region: string | default="{{ .Values.microvm.region }}"
      name: string
    status:
      # The HANDOFF the shim reads to RunMicrovm (imperatively) per session:
      #   imageARN         → Microvm.imageIdentifier
      #   executionRoleARN → Microvm.executionRoleARN
      # Plus imageState so the shim only launches once the build is CREATED/UPDATED.
      imageARN: ${image.status.ackResourceMetadata.arn}
      imageState: ${image.status.state}
      imageVersion: ${image.status.latestActiveImageVersion}
      executionRoleARN: ${execRole.status.ackResourceMetadata.arn}
  resources:
    # 1) S3 bucket that stores the MicroVM code artifact (GA — Managed ACK).
    - id: bucket
      template:
        apiVersion: s3.services.k8s.aws/v1alpha1
        kind: Bucket
        metadata:
          name: ${schema.spec.name}-microvm-artifacts
        spec:
          name: ${schema.spec.name}-microvm-artifacts
    # 2) IAM role the image BUILD assumes (GA — Managed ACK). Platform-owned.
    #    Lambda assumes this during create-microvm-image to pull the code artifact
    #    (ECR/S3) + write build logs. Trust = lambda.amazonaws.com (verified in the
    #    Lambda MicroVM getting-started docs), with inline ECR-read + S3-read + logs.
    - id: buildRole
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          name: ${schema.spec.name}-microvm-build
        spec:
          name: ${schema.spec.name}-microvm-build
          assumeRolePolicyDocument: |
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":["sts:AssumeRole","sts:TagSession"]}]}
          inlinePolicies:
            microvm-build: |
              {"Version":"2012-10-17","Statement":[
                {"Effect":"Allow","Action":["ecr:GetAuthorizationToken","ecr:BatchGetImage","ecr:GetDownloadUrlForLayer"],"Resource":"*"},
                {"Effect":"Allow","Action":["s3:GetObject","s3:ListBucket"],"Resource":["arn:aws:s3:::${bucket.spec.name}","arn:aws:s3:::${bucket.spec.name}/*"]},
                {"Effect":"Allow","Action":["logs:CreateLogGroup","logs:CreateLogStream","logs:PutLogEvents"],"Resource":"arn:aws:logs:*:*:log-group:/aws/lambda/microvms/*"}
              ]}
    # 3) IAM role the RUNNING MicroVM assumes (GA — Managed ACK). App-owned exec identity.
    #    Minimal by default (the coder reaches models via Bifrost, git/gh via public
    #    egress — no AWS API needed); trust = lambda.amazonaws.com.
    - id: execRole
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          name: ${schema.spec.name}-microvm-exec
        spec:
          name: ${schema.spec.name}-microvm-exec
          assumeRolePolicyDocument: |
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":["sts:AssumeRole","sts:TagSession"]}]}
    # 4) MicrovmImage (pre-GA — SELF-MANAGED lambdamicrovms controller). Platform-owned.
    #    readyWhen gates the Microvm (resource 5) on a genuinely SUCCESSFUL build —
    #    state CREATED/UPDATED — so the instance never launches from a half-built or
    #    failed image (KRO holds the Microvm until this predicate is true).
    - id: image
      readyWhen:
        - ${image.status.state == "CREATED" || image.status.state == "UPDATED"}
      template:
        apiVersion: lambdamicrovms.services.k8s.aws/v1alpha1
        kind: MicrovmImage
        metadata:
          name: ${schema.spec.name}-image
        spec:
          name: ${schema.spec.name}-image
          baseImageARN: ${schema.spec.baseImageARN}
          buildRoleARN: ${buildRole.status.ackResourceMetadata.arn}
          codeArtifact:
            uri: ${schema.spec.codeArtifactUri}
          # Lambda MicroVM is ARM_64-ONLY — the sole supported architecture. The
          # code artifact + any bundled binaries must be arm64 (dark-factory-coder
          # is built for arm64 for exactly this substrate).
          cpuConfigurations:
            - architecture: ARM_64
          # CloudWatch build/runtime logs. On a CREATE_FAILED the controller can't
          # see the build output — this is where it lands:
          #   aws logs tail /aws/lambda/microvms/${schema.spec.name}-image
          logging:
            cloudWatch:
              logGroup: /aws/lambda/microvms/${schema.spec.name}-image
    # NOTE: there is deliberately NO `Microvm` resource here. The running MicroVM is
    # a per-session, request-time resource — the shim (microvm-lifecycle controller,
    # template 52) creates it with RunMicrovm and drives suspend/resume/terminate as
    # imperative SDK ops (the ACK controller does not reconcile those). This RGD stops
    # at "image built + exec role ready", handed off via status above.
{{- if .Values.microvm.image.enabled | default true }}
---
# The ONE platform MicrovmSandbox INSTANCE — applied by GitOps, reconciled by KRO
# ONCE to build the coder image + its build/exec roles + artifact bucket. This is
# slow-changing platform infra (one image per cluster), NOT per-session — so it lives
# here in the chart, not in the per-claim shim. The shim reads THIS object's status
# (imageARN + executionRoleARN) to RunMicrovm per session. Rebuild the image by
# bumping microvm.codeArtifactUri (a new artifact) and re-syncing.
apiVersion: {{ .Values.microvm.apiGroup | default "sandbox.agents.x-k8s.io" }}/v1alpha1
kind: MicrovmSandbox
metadata:
  name: {{ .Values.microvm.image.name | default "coder" }}
  namespace: {{ include "agent-sandbox.namespace" . }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  name: {{ .Values.microvm.image.name | default "coder" }}
  region: {{ .Values.microvm.region | quote }}
  baseImageARN: {{ .Values.microvm.baseImageARN | quote }}
  codeArtifactUri: {{ .Values.microvm.codeArtifactUri | quote }}
{{- end }}
{{- end }}
