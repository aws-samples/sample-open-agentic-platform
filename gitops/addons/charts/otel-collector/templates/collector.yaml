apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    receivers:
      # Accepts OTLP traces from agents and Bifrost
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      {{- if .Values.bifrost.enabled }}
      # Scrapes Prometheus metrics from Bifrost proxy
      prometheus:
        config:
          scrape_configs:
            - job_name: bifrost
              scrape_interval: 15s
              static_configs:
                - targets: ["{{ .Values.bifrost.scrapeEndpoint }}"]
      {{- end }}

    processors:
      # 100% sampling — never drop agent or LLM spans
      probabilistic_sampler:
        sampling_percentage: 100.0
      # Batch for efficient export
      batch:
        send_batch_size: 256
        timeout: 1s
        send_batch_max_size: 512
      memory_limiter:
        check_interval: 5s
        limit_mib: 400
        spike_limit_mib: 100

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    exporters:
      {{- if .Values.xray.enabled }}
      awsxray:
        region: {{ .Values.global.awsRegion }}
      {{- end }}
      {{- if .Values.langfuse.enabled }}
      # Pushes unified trace tree (agent + Bifrost spans) to Langfuse
      otlphttp/langfuse:
        endpoint: "{{ .Values.langfuse.endpoint }}"
        headers:
          Authorization: "Basic ${LANGFUSE_OTEL_AUTH}"
          x-langfuse-ingestion-version: "4"
      {{- end }}
      {{- if .Values.bifrost.enabled }}
      # Forwards Bifrost metrics to AMP via remote write
      prometheusremotewrite:
        endpoint: "${AMP_REMOTE_WRITE_ENDPOINT}"
        auth:
          authenticator: sigv4auth
      {{- end }}

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [probabilistic_sampler, memory_limiter, batch]
          exporters:
            {{- if .Values.xray.enabled }}
            - awsxray
            {{- end }}
            {{- if .Values.langfuse.enabled }}
            - otlphttp/langfuse
            {{- end }}
        {{- if .Values.bifrost.enabled }}
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters:
            - prometheusremotewrite
        {{- end }}

      telemetry:
        logs:
          level: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app: otel-collector
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: {{ .Values.collector.image }}
          args:
            - '--config=/conf/config.yaml'
          ports:
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
          env:
            - name: AWS_REGION
              value: {{ .Values.global.awsRegion }}
            {{- if .Values.langfuse.enabled }}
            - name: LANGFUSE_OTEL_AUTH
              valueFrom:
                secretKeyRef:
                  name: langfuse-otel-auth
                  key: LANGFUSE_OTEL_AUTH
                  optional: true
            {{- end }}
            - name: AMP_REMOTE_WRITE_ENDPOINT
              value: ""
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  type: ClusterIP
