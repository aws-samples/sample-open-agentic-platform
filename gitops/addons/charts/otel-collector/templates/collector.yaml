apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      {{- if .Values.bifrost.enabled }}
      prometheus:
        config:
          scrape_configs:
            - job_name: bifrost-llm-gateway
              scrape_interval: 15s
              static_configs:
                - targets: ["{{ .Values.bifrost.scrapeEndpoint }}"]
      {{- end }}

    processors:
      # 100% trace preservation — never drop agent or LLM spans
      probabilistic_sampler:
        sampling_percentage: 100.0
      # Memory safeguard — prevents OOM kernel termination
      memory_limiter:
        check_interval: 1s
        limit_percentage: 85
        spike_limit_percentage: 10
      # Batch processing — compresses payloads before export
      batch:
        send_batch_size: 1024
        timeout: 500ms
        send_batch_max_size: 2048

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    exporters:
      {{- if .Values.xray.enabled }}
      awsxray:
        region: {{ .Values.global.awsRegion }}
      {{- end }}
      {{- if .Values.bifrost.enabled }}
      debug:
        verbosity: basic
      {{- end }}
      {{- if and .Values.langfuse.enabled .Values.langfuse.endpoint }}
      # Consolidated trace trees to Langfuse v3
      otlphttp/langfuse:
        endpoint: "{{ .Values.langfuse.endpoint }}"
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 5m
        headers:
          Authorization: "Basic ${LANGFUSE_OTEL_AUTH}"
          x-langfuse-ingestion-version: "4"
      {{- end }}

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, probabilistic_sampler, batch]
          exporters:
            {{- if .Values.xray.enabled }}
            - awsxray
            {{- end }}
            {{- if and .Values.langfuse.enabled .Values.langfuse.endpoint }}
            - otlphttp/langfuse
            {{- end }}
        {{- if .Values.bifrost.enabled }}
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters:
            - debug
        {{- end }}
      telemetry:
        logs:
          level: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app: otel-collector
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: {{ .Values.collector.image }}
          args:
            - '--config=/conf/config.yaml'
          ports:
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
          env:
            - name: AWS_REGION
              value: {{ .Values.global.awsRegion }}
            {{- if and .Values.langfuse.enabled .Values.langfuse.endpoint }}
            - name: LANGFUSE_OTEL_AUTH
              valueFrom:
                secretKeyRef:
                  name: langfuse-otel-auth
                  key: LANGFUSE_OTEL_AUTH
                  optional: true
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  type: ClusterIP
