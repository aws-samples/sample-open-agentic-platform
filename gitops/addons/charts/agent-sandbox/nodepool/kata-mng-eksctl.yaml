# Self-managed nested-virt Managed Node Group for Kata sandboxes, added to an
# existing EKS Auto Mode cluster (spoke-dev). Auto Mode keeps running everything
# else; kata sandboxes schedule here via the kata=true taint. Validated by the
# 2026-07-10 spike (see docs/dark-factory §12a).
#
# Apply:  eksctl create nodegroup -f kata-mng-eksctl.yaml
# Requires eksctl with EKS Auto Mode coexistence support and an AMI/instance
# that exposes nested virtualization (c8i/m8i).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: spoke-dev              # target cluster
  region: us-west-2

managedNodeGroups:
  - name: kata-sandbox
    # Nested-virt Intel instances (expose VT-x via CpuOptions.NestedVirtualization).
    instanceTypes: ["c8i.4xlarge", "m8i.4xlarge"]
    amiFamily: AmazonLinux2023
    minSize: 0                 # scale-to-zero when no sandbox is claimed
    maxSize: 3
    desiredCapacity: 1
    privateNetworking: true
    volumeSize: 100
    # Labels applied at node birth: kata-enabled is the STATIC label kata-deploy
    # targets; katacontainers.io/kata-runtime is (re)emitted by kata-deploy.
    labels:
      kata-enabled: "true"
      katacontainers.io/kata-runtime: "true"
      node-type: kata-mng
    # Only kata sandboxes tolerate this taint — keeps general workloads off.
    taints:
      - key: kata
        value: "true"
        effect: NoSchedule
    # nested virtualization + the modprobe/nodeadm userData are supplied via a
    # launch template (eksctl overrideBootstrapCommand cannot set CpuOptions).
    # See kata-mng-launch-template-userdata.mime and the Terraform variant.
    # launchTemplate:
    #   id: lt-xxxxxxxx
    tags:
      platform: open-agent-platform
      capability: agent-sandbox
    iam:
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
