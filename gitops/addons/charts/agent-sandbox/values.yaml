# Agent Sandbox capability — default values
#
# This chart installs the Sandbox control plane (operator + CRDs), the Kata
# RuntimeClasses that workloads select via runtimeClassName, a SandboxTemplate
# the Dark Factory (and other consumers) claim against, and a pool-manager that
# keeps a warm buffer of idle sandboxes ready.

# Namespace the sandbox capability runs in (operator, pool-manager, warm pool).
namespace: agent-sandbox-system

# ── Sandbox operator (agents.x-k8s.io) ───────────────────────────────────────
operator:
  # Upstream agent-sandbox controller image.
  image: public.ecr.aws/t6v6o5d5/agent-sandbox:v0.1.0
  replicas: 1
  # Install the Sandbox / SandboxTemplate / SandboxClaim CRDs with the chart.
  # Disable if the cluster already has a newer operator managing the CRDs.
  installCRDs: true

# NOTE: The Kata *runtime installer* (kata-deploy) is delivered as a SEPARATE
# gated ArgoCD app (enable_agent_sandbox_kata), not from this chart — see the
# addon catalog and docs/dark-factory §12a. This chart owns the RuntimeClasses,
# operator, template, network policy, and pool-manager.

# ── Kata micro-VM runtime ────────────────────────────────────────────────────
kata:
  # VMM the WARM POOL (SandboxTemplate) runs on — a key of runtimeClasses below.
  # Flip this one value to swap the VMM for every warm/claimed sandbox:
  #   clh  → Cloud Hypervisor (default; boots fast, nested-virt kata-nested pool)
  #   qemu → QEMU            (same kata pool as clh — same kata-deploy runtime)
  #   fc   → Firecracker     (SEPARATE kata-fc pool + kata-deploy-fc + devmapper;
  #                           requires kata_nodepool kataFc + kata-deploy-fc enabled)
  # All runtimeClasses are still RENDERED regardless (an ad-hoc pod may select any
  # of them); `vmm` only steers the warm pool. Changing it recreates the
  # SandboxTemplate → the pool refills onto the new VMM's nodes.
  vmm: clh
  # RuntimeClasses to render, keyed by VMM. EACH carries the nodeSelector +
  # tolerations that steer a pod onto the MATCHING Karpenter pool — clh/qemu share
  # the kata pool (taint `kata`, label katacontainers.io/kata-runtime), fc uses the
  # firecracker pool (taint `kata-fc`, label katacontainers.io/kata-runtime-fc).
  # The RuntimeClass admission controller force-merges this scheduling onto every
  # pod that selects the class, so a workload only needs runtimeClassName.
  runtimeClasses:
    clh:
      name: kata-clh
      handler: kata-clh
      nodeSelector:
        katacontainers.io/kata-runtime: "true"
      tolerations:
        - key: kata
          operator: Equal
          value: "true"
          effect: NoSchedule
    qemu:
      name: kata-qemu
      handler: kata-qemu
      nodeSelector:
        katacontainers.io/kata-runtime: "true"
      tolerations:
        - key: kata
          operator: Equal
          value: "true"
          effect: NoSchedule
    fc:
      name: kata-fc
      handler: kata-fc
      nodeSelector:
        katacontainers.io/kata-runtime-fc: "true"
      tolerations:
        - key: kata-fc
          operator: Equal
          value: "true"
          effect: NoSchedule

# ── NetworkPolicy (egress lockdown) ──────────────────────────────────────────
networkPolicy:
  # Private/link-local CIDRs carved OUT of the coder's :443 public-internet
  # allow. On the hub the capability sits next to the fleet control plane
  # (Keycloak/ArgoCD/external-secrets/Argo) reachable via ClusterIPs + pod IPs
  # in the VPC private range; denying RFC-1918 + link-local blocks every path to
  # the control plane, the node, the API server, and peer pods while still
  # permitting public git/gh/registry egress. Covers hub VPC 10.0.0.0/16, pods
  # (in-VPC), and service CIDR 172.20.0.0/16.
  # NOTE (EKS VPC-CNI): NetworkPolicy egress ipBlock is matched on the Service
  # ClusterIP *before* kube-proxy DNAT, so the service CIDR must be listed
  # EXPLICITLY as its own except entry — the 172.16/12 supernet alone does NOT
  # reliably catch 172.20.0.0/16 ClusterIP traffic (verified on this cluster:
  # /12 let control-plane ClusterIPs through; the explicit /16 blocks them).
  privateCidrsDenied:
    - 172.20.0.0/16       # EKS service CIDR (control-plane ClusterIPs) — MUST be explicit
    - 10.0.0.0/8          # RFC-1918 (hub VPC + pod IPs)
    - 172.16.0.0/12       # RFC-1918
    - 192.168.0.0/16      # RFC-1918
    - 169.254.0.0/16      # link-local (blocks IMDS 169.254.169.254)

  # Admin-tier ClusterNetworkPolicy (31-clusternetworkpolicy.yaml) — control-plane
  # isolation that applies regardless of pod ownership (the standard NetworkPolicy
  # above only applies to Deployment-owned pods; coder pods are Sandbox-CR-owned).
  #
  # EKS VPC-CNI limitation (verified): neither standard NetworkPolicy nor Admin
  # ClusterNetworkPolicy egress applies to Service ClusterIP (172.20.x) traffic —
  # DNAT'd before policy eval. Pod-to-pod (backend pod IPs 10.0.x) IS blocked by
  # both tiers. The ClusterIP gap is now CLOSED at the node layer by the
  # clusteripFirewall DaemonSet below (conntrack --ctorigdst FORWARD rules).
  # Full defense-in-depth: Kata VM + no creds (no SA token, no IAM) + pod-IP deny
  # (both policy tiers) + ClusterIP deny (node firewall) + service auth.
  adminDenyControlPlane: true
  adminPriority: 10
  # Namespaces the untrusted coder must NEVER reach on the hub build plane.
  # NOTE: kube-system is deliberately NOT listed — CoreDNS lives there and the
  # coder needs :53 for git/gh resolution; an Admin-tier Deny is all-ports and
  # would break DNS. kube-system carries no exfil-worthy secrets the coder can
  # use (it has no SA token), and IMDS/API access is already blocked by the
  # standard policy's CIDR denies.
  controlPlaneNamespaces:
    - argocd
    - argo
    - keycloak
    - external-secrets
    - crossplane-system
    - langfuse

  # ClusterIP egress firewall (32-clusterip-egress-firewall.yaml) — the DEFINITIVE
  # fix for the VPC-CNI ClusterIP-DNAT gap documented above. A host-network,
  # NET_ADMIN DaemonSet on the kata node installs FORWARD iptables rules matching
  # conntrack --ctorigdst (the ORIGINAL ClusterIP before kube-proxy DNAT), allowing
  # only the Bifrost ClusterIP and DROPping the rest of the service CIDR. Verified
  # live: closes the external-secrets/kube-api ClusterIP socket while keeping
  # Bifrost + public egress + DNS working. Only runs on the tainted kata node.
  clusteripFirewall:
    # DISABLED: superseded by NetworkPolicy 30 (privateCidrsDenied lists the EKS
    # service CIDR 172.20.0.0/16 explicitly, which blocks control-plane ClusterIPs
    # on VPC-CNI without raw iptables) + Admin ClusterNetworkPolicy 31. Verified on
    # spoke-dev: NP alone blocks the API-server ClusterIP and allows Bifrost. The
    # iptables DaemonSet also over-broadly hooked the whole node FORWARD chain,
    # blocking non-hostNetwork infra pods (e.g. kata-deploy) from the API server.
    enabled: false
    # Runs in kube-system (privileged node infra home) — agent-sandbox-system
    # enforces `baseline` PodSecurity which forbids hostNetwork + NET_ADMIN.
    namespace: kube-system
    image: alpine/k8s:1.31.0     # needs kubectl + iptables
    serviceCidr: 172.20.0.0/16   # EKS service CIDR (hub)
    bifrostNamespace: bifrost
    bifrostService: bifrost
    bifrostPort: 8080
    reconcileSeconds: 30

# NOTE: kata-readiness removed — kata-deploy 4.0.0 (PR kata-containers#13284)
# removes the runtime-not-ready startup taint itself as its final install step
# (see startupTaints in the kata-deploy registry entry, sandbox.yaml).

# ── Warm pool ────────────────────────────────────────────────────────────────
warmPool:
  enabled: true
  # Number of idle sandboxes to keep ready. Claim one → pool-manager refills;
  # release one → pool-manager shrinks back to this target.
  targetIdle: 3
  # Idle sandboxes scale to replicas:0 after this TTL (PVC retained); resume on
  # demand. Set 0 to keep idle sandboxes running (higher cost, instant claim).
  idleScaleToZeroSeconds: 900
  # Hard TTL — a claimed sandbox with no activity past this is reaped (safety
  # net for crashed/abandoned consumers).
  reapAfterSeconds: 3600
  # The SandboxTemplate that idle/claimed sandboxes are cloned from.
  templateName: coder-sandbox

# ── Pool-manager controller ──────────────────────────────────────────────────
poolManager:
  # Image for the reconcile loop — MUST have both kubectl AND jq (the script
  # exits early if kubectl is missing). aws-cli image has neither; use an
  # alpine/k8s image that bundles kubectl + jq + helm.
  image: alpine/k8s:1.31.0
  # How often the reconcile/reaper loop runs.
  intervalSeconds: 60
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

# ── Coder SandboxTemplate (podTemplate the warm pool clones) ─────────────────
coderTemplate:
  # Allow Flow B to inject per-claim env (SPEC/repo/branch/profile) via SandboxClaim.
  envVarsInjectionPolicy: Overrides
  # Mount a k8s Secret at /etc/secrets (mode 0400) so the coder can read its
  # GitHub token. This is the CODER credential — a separate, lower-privilege
  # credential from the hub-side orchestrator/events tokens (review C1), because
  # the coder runs model-written code whose prompt is attacker-controllable
  # issue text.
  #
  # Scope: Contents:write on the target repo and NOTHING else — it must not be
  # able to merge (Pull requests:write) or administer webhooks (Webhooks:write).
  # Contents:write still permits a direct branch push, so branch protection on
  # the default branch is REQUIRED for this boundary to mean anything.
  secretsMount:
    enabled: true
    secretName: dark-factory-github-coder
    # Filename the coder reads under /etc/secrets.
    key: gh-token
    # Provision secretName from AWS Secrets Manager via external-secrets.
    # NOTE: this is a standing credential. The stronger design (review C1 as
    # written) mints a short-TTL GitHub App installation token per run and
    # injects it via the SandboxClaim, so the VM never holds a reusable secret.
    externalSecret:
      enabled: true
      clusterSecretStore: aws-secrets-manager
      # Set dynamically: <cluster>/dark-factory/github/coder — injected from the
      # aws_cluster_name annotation via the registry valuesObject. Cluster-scoped
      # so this cluster's ESO IRSA can be limited to <cluster>/* and therefore
      # CANNOT read the hub's orchestrator/events tokens. Empty default keeps the
      # ExternalSecret inert until injected.
      secretManagerKey: ""
      property: token
      refreshInterval: 1h
  # Sandbox coder image — built from examples/dark-factory/coder (entrypoint.js).
  #
  # NOTE: ECR account 940019131157 is an EXAMPLE registry. The agent-sandbox
  # registry entry (gitops/addons/registry/sandbox.yaml) overrides this per cluster,
  # templating the URI from the aws_account_id + aws_region cluster annotations, so
  # a deployment does not need to edit this default or add an overlay.
  image: 940019131157.dkr.ecr.us-west-2.amazonaws.com/dark-factory-coder:v0.2.5
  # Warm pods idle until a SandboxClaim injects DF_ISSUE_NUMBER, then exec the
  # baked-in coder entrypoint (node /app/entrypoint.js). If the image has no such
  # entrypoint (placeholder busybox), the poll loop just idles forever — safe.
  command:
    - /bin/sh
    - -c
    - |
      echo "[sandbox] idle — waiting for a SandboxClaim to inject DF_ISSUE_NUMBER..."
      while [ -z "${DF_ISSUE_NUMBER:-}" ]; do sleep 5; done
      echo "[sandbox] claim injected issue #${DF_ISSUE_NUMBER} — starting coder"
      if [ -f /app/entrypoint.js ]; then exec node /app/entrypoint.js; fi
      echo "[sandbox] no coder entrypoint in this image (placeholder) — idling"; sleep infinity
  workspaceSizeGi: 5
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }
  # LLM gateway the coder reaches (this platform uses Bifrost, not LiteLLM).
  # In-cluster service DNS. The registry entry injects this per-cluster from the
  # `bifrost_url` cluster-secret annotation (registry/sandbox.yaml), so this is the
  # fallback when that annotation is absent.
  #
  # Was previously a hardcoded ClusterIP, which shipped one cluster's ephemeral
  # address as the chart default. If a Kata VM guest cannot resolve cluster svc
  # names (a known P2 — fix the VM dnsConfig), set the `bifrost_url` annotation on
  # that cluster to a reachable ClusterIP rather than editing this default.
  bifrostUrl: http://bifrost.bifrost.svc.cluster.local:8080
