# Agent Sandbox capability — default values
#
# This chart installs the Sandbox control plane (operator + CRDs), the Kata
# RuntimeClasses that workloads select via runtimeClassName, a SandboxTemplate
# the Dark Factory (and other consumers) claim against, and a pool-manager that
# keeps a warm buffer of idle sandboxes ready.

# Namespace the sandbox capability runs in (operator, pool-manager, warm pool).
namespace: agent-sandbox-system

# ── Sandbox operator (agents.x-k8s.io) ───────────────────────────────────────
operator:
  # Upstream agent-sandbox controller image.
  image: public.ecr.aws/t6v6o5d5/agent-sandbox:v0.1.0
  replicas: 1
  # Install the Sandbox / SandboxTemplate / SandboxClaim CRDs with the chart.
  # Disable if the cluster already has a newer operator managing the CRDs.
  installCRDs: true

# NOTE: The Kata *runtime installer* (kata-deploy) is delivered as a SEPARATE
# gated ArgoCD app (enable_agent_sandbox_kata), not from this chart — see the
# addon catalog and docs/dark-factory §12a. This chart owns the RuntimeClasses,
# operator, template, network policy, and pool-manager.

# ── Kata micro-VM runtime ────────────────────────────────────────────────────
kata:
  # Default VMM for coder sandboxes. Cloud Hypervisor (clh) boots fast and is
  # the platform default; qemu and fc (Firecracker) are also installed.
  defaultRuntimeClass: kata-clh
  # RuntimeClasses to render. Each carries the nodeSelector + toleration that
  # steers a pod onto the matching Karpenter kata pool.
  runtimeClasses:
    - name: kata-clh
      handler: kata-clh
    - name: kata-qemu
      handler: kata-qemu
  # Node scheduling applied to every kata RuntimeClass.
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
  tolerations:
    - key: kata
      operator: Equal
      value: "true"
      effect: NoSchedule

# ── kata-readiness ───────────────────────────────────────────────────────────
# Removes the runtime-not-ready startup taint once kata-deploy finishes on a
# node. Required whenever nodes carry that startup taint (the kata MNG does).
kataReadiness:
  enabled: true
  image: alpine/k8s:1.31.0   # needs kubectl

# ── Warm pool ────────────────────────────────────────────────────────────────
warmPool:
  enabled: true
  # Number of idle sandboxes to keep ready. Claim one → pool-manager refills;
  # release one → pool-manager shrinks back to this target.
  targetIdle: 3
  # Idle sandboxes scale to replicas:0 after this TTL (PVC retained); resume on
  # demand. Set 0 to keep idle sandboxes running (higher cost, instant claim).
  idleScaleToZeroSeconds: 900
  # Hard TTL — a claimed sandbox with no activity past this is reaped (safety
  # net for crashed/abandoned consumers).
  reapAfterSeconds: 3600
  # The SandboxTemplate that idle/claimed sandboxes are cloned from.
  templateName: coder-sandbox

# ── Pool-manager controller ──────────────────────────────────────────────────
poolManager:
  # Image for the reconcile loop — MUST have both kubectl AND jq (the script
  # exits early if kubectl is missing). aws-cli image has neither; use an
  # alpine/k8s image that bundles kubectl + jq + helm.
  image: alpine/k8s:1.31.0
  # How often the reconcile/reaper loop runs.
  intervalSeconds: 60
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

# ── Coder SandboxTemplate (podTemplate the warm pool clones) ─────────────────
coderTemplate:
  # Sandbox coder image is set by the consumer (Dark Factory picks the coder
  # profile — claude-code | kiro). Placeholder here; overridden per claim.
  image: public.ecr.aws/docker/library/busybox:1.36
  workspaceSizeGi: 5
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }
  # LLM gateway the coder reaches (this platform uses Bifrost, not LiteLLM).
  bifrostUrl: http://bifrost.bifrost.svc.cluster.local:8080
