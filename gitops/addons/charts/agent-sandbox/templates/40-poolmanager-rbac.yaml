{{- if .Values.warmPool.enabled }}
{{- /*
RBAC for the pool-manager: narrowly scoped to Sandboxes/PVCs/Services in the
capability namespace only. It maintains the warm buffer and reaps idle/expired
sandboxes — it never touches cluster-wide resources or other namespaces.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sandbox-pool-manager
  namespace: {{ include "agent-sandbox.namespace" . }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-sandbox-pool-manager
  namespace: {{ include "agent-sandbox.namespace" . }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-sandbox-pool-manager
  namespace: {{ include "agent-sandbox.namespace" . }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: agent-sandbox-pool-manager
    namespace: {{ include "agent-sandbox.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-sandbox-pool-manager
{{- end }}
