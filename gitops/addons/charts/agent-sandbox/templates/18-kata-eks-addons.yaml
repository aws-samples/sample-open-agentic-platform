{{- if and .Values.nodepool .Values.nodepool.enabled .Values.nodepool.manageAddons }}
{{- /*
EKS addons required for the self-managed kata node — GitOps-managed via Crossplane.

Auto Mode's built-in networking applies ONLY to its own managed nodes. A
self-managed MNG node has NEITHER the CNI nor kube-proxy that pods need, so both
EKS addons MUST be present or pods on the kata node can't reach the API server:
  - without vpc-cni    → node stays NotReady ("cni plugin not initialized")
  - without kube-proxy → no iptables for kubernetes.default.svc → kata-deploy
                         crashloops ("Failed to get node ... Connect")
(Root-caused in the 2026-07-10 spike — docs/dark-factory §12a.)

ADOPTION: external-name "<cluster>:<addon>" imports the existing cluster addons in
place. Gated behind nodepool.manageAddons so it's opt-in (the addons may already
be owned by the base platform on some clusters).
*/ -}}
apiVersion: eks.aws.upbound.io/v1beta1
kind: Addon
metadata:
  name: {{ .Values.nodepool.clusterName }}-vpc-cni
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
  annotations:
    crossplane.io/external-name: {{ printf "%s:vpc-cni" .Values.nodepool.clusterName | quote }}
spec:
  forProvider:
    region: {{ .Values.nodepool.region | quote }}
    clusterName: {{ .Values.nodepool.clusterName | quote }}
    addonName: vpc-cni
    resolveConflictsOnCreate: OVERWRITE
    resolveConflictsOnUpdate: OVERWRITE
  providerConfigRef:
    name: {{ .Values.nodepool.providerConfigName | default "default" }}
---
apiVersion: eks.aws.upbound.io/v1beta1
kind: Addon
metadata:
  name: {{ .Values.nodepool.clusterName }}-kube-proxy
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
  annotations:
    crossplane.io/external-name: {{ printf "%s:kube-proxy" .Values.nodepool.clusterName | quote }}
spec:
  forProvider:
    region: {{ .Values.nodepool.region | quote }}
    clusterName: {{ .Values.nodepool.clusterName | quote }}
    addonName: kube-proxy
    resolveConflictsOnCreate: OVERWRITE
    resolveConflictsOnUpdate: OVERWRITE
  providerConfigRef:
    name: {{ .Values.nodepool.providerConfigName | default "default" }}
{{- end }}
