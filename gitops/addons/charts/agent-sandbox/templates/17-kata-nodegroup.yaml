{{- if and .Values.nodepool .Values.nodepool.enabled }}
{{- /*
Kata nested-virt Managed Node Group — GitOps-managed via Crossplane (provider-aws-eks).

Self-managed MNG alongside EKS Auto Mode (Auto Mode's Bottlerocket nodes can't
host Kata). Uses the nested-virt LaunchTemplate (16-...). Scale-to-zero when no
sandbox is claimed; the pool-manager scales up on a claim. Only kata pods tolerate
the taint, so general workloads never land here.

ADOPTION: crossplane.io/external-name = <cluster>/<nodegroup> imports the existing
node group in place — no recreate, no node churn.
*/ -}}
apiVersion: eks.aws.upbound.io/v1beta2
kind: Nodegroup
metadata:
  name: {{ .Values.nodepool.nodegroupName | default "kata-sandbox" }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
  annotations:
    # Adopt the existing node group in place: "<clusterName>/<nodegroupName>".
    crossplane.io/external-name: {{ printf "%s/%s" .Values.nodepool.clusterName (.Values.nodepool.nodegroupName | default "kata-sandbox") | quote }}
spec:
  forProvider:
    region: {{ .Values.nodepool.region | quote }}
    clusterName: {{ .Values.nodepool.clusterName | quote }}
    nodeRoleArn: {{ .Values.nodepool.nodeRoleArn | quote }}
    subnetIds:
      {{- range .Values.nodepool.subnetIds }}
      - {{ . | quote }}
      {{- end }}
    # Scale-to-zero idle; pool-manager scales up per claim (max = pool ceiling).
    scalingConfig:
      - minSize: {{ .Values.nodepool.minSize | default 0 }}
        desiredSize: {{ .Values.nodepool.desiredSize | default 1 }}
        maxSize: {{ .Values.nodepool.maxSize | default 3 }}
    launchTemplate:
      - id: {{ .Values.nodepool.launchTemplateId | quote }}
        version: {{ .Values.nodepool.launchTemplateVersion | default "$Latest" | quote }}
    # Only kata sandboxes tolerate this — keeps general workloads off the pool.
    taint:
      - key: kata
        value: "true"
        effect: NO_SCHEDULE
    labels:
      kata-enabled: "true"
      katacontainers.io/kata-runtime: "true"
      node-type: kata-mng
    tags:
      platform: open-agent-platform
      capability: agent-sandbox
  providerConfigRef:
    name: {{ .Values.nodepool.providerConfigName | default "default" }}
{{- end }}
