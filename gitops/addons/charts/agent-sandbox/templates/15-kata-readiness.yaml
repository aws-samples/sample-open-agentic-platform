{{- if .Values.kataReadiness.enabled }}
{{- /*
kata-readiness — removes the katacontainers.io/runtime-not-ready STARTUP TAINT
once kata-deploy finishes installing the runtime on a node.

Why needed (live-test lesson): kata nodes register with a runtime-not-ready
startup taint so no workload binds before the runtime exists. kata-deploy does
NOT remove that taint itself. This DaemonSet watches the kata-deploy pod on its
node reach Ready (its /readyz flips 503→200 only after install completes), then
removes the taint so kata sandboxes can schedule. Ported from
eks-platform-openclaw PR #10.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kata-readiness
  namespace: {{ include "agent-sandbox.namespace" . }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sandbox-kata-readiness
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-kata-readiness
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: kata-readiness
    namespace: {{ include "agent-sandbox.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-sandbox-kata-readiness
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kata-readiness
  namespace: {{ include "agent-sandbox.namespace" . }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: kata-readiness
  template:
    metadata:
      labels:
        app: kata-readiness
        {{- include "agent-sandbox.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: kata-readiness
      # Tolerate everything so it lands BEFORE the runtime is ready — including
      # the kata workload taint and the runtime-not-ready startup taint it removes.
      tolerations:
        - operator: Exists
      # Static label present from node birth (kata-deploy emits
      # katacontainers.io/kata-runtime only after install, so we can't select on it).
      nodeSelector:
        kata-enabled: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kata-readiness
          image: {{ .Values.kataReadiness.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "[kata-readiness] node=${NODE_NAME}: waiting for kata-deploy Ready..."
              until [ "$(kubectl get pods -n kube-system -l name=kata-deploy \
                  --field-selector "spec.nodeName=${NODE_NAME}" \
                  -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}')" = "True" ]; do
                sleep 5
              done
              echo "[kata-readiness] kata-deploy Ready; removing runtime-not-ready taint..."
              kubectl taint node "${NODE_NAME}" katacontainers.io/runtime-not-ready:NoSchedule- || true
              echo "[kata-readiness] node ${NODE_NAME} ready for kata workloads."
              sleep infinity
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
{{- end }}
