{{- if and .Values.nodepool .Values.nodepool.enabled }}
{{- /*
Kata nested-virt Launch Template — GitOps-managed via Crossplane (provider-aws-ec2).

Kata micro-VMs need HARDWARE virtualization, which EKS Auto Mode's managed
Bottlerocket nodes can't provide. This LaunchTemplate carries the ONE flag that
makes it work — cpuOptions.nestedVirtualization=enabled (exposes VT-x on 8i
instances) — plus the AL2023 nodeadm userData that loads kvm_intel and joins the
cluster with the kata labels + startup taint.

Previously this was applied out-of-band (nodepool/kata-mng.tf | eksctl). It is now
a first-class Crossplane managed resource so ArgoCD owns it end-to-end.

ADOPTION: set nodepool.launchTemplateId to the existing LT id and Crossplane
imports it in place (external-name) rather than creating a duplicate.
*/ -}}
apiVersion: ec2.aws.upbound.io/v1beta2
kind: LaunchTemplate
metadata:
  name: {{ .Values.nodepool.clusterName }}-kata
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.nodepool.launchTemplateId }}
    # Adopt the existing launch template in place (no duplicate).
    crossplane.io/external-name: {{ .Values.nodepool.launchTemplateId | quote }}
    {{- end }}
spec:
  # ArgoCD-managed: let Crossplane reconcile toward this spec, but don't fight
  # drift on late-binding fields AWS fills in.
  forProvider:
    region: {{ .Values.nodepool.region | quote }}
    namePrefix: {{ .Values.nodepool.clusterName }}-kata-
    imageId: {{ .Values.nodepool.amiId | quote }}
    instanceType: {{ .Values.nodepool.instanceType | quote }}
    # THE key flag — hardware nested virtualization for the Kata VMM.
    cpuOptions:
      - nestedVirtualization: enabled
    # nodeadm MIME userData: modprobe kvm_intel (so /dev/kvm exists) + NodeConfig
    # that joins the cluster with the kata labels + the two taints (workload +
    # startup-not-ready gate that the kata-readiness DaemonSet later removes).
    userData: {{ include "agent-sandbox.kataUserData" . | b64enc | quote }}
    tagSpecifications:
      - resourceType: instance
        tags:
          platform: open-agent-platform
          capability: agent-sandbox
  providerConfigRef:
    name: {{ .Values.nodepool.providerConfigName | default "default" }}
{{- end }}
