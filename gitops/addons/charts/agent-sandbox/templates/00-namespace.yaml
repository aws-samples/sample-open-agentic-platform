apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "agent-sandbox.namespace" . }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
    # PSS = baseline (NOT restricted). This namespace hosts BOTH the coder
    # sandboxes AND the agent-sandbox operator — and the upstream
    # operator + kata tooling are not restricted-compliant (they'd be blocked).
    # The coder sandboxes get their real isolation from the KATA micro-VM
    # boundary + the restricted securityContext baked into the SandboxTemplate
    # pod spec — not from namespace PSS. (Live-test lesson: restricted here
    # blocks the v0.5.1 controller pod entirely.)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
