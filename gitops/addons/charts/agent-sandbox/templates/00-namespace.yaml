apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "agent-sandbox.namespace" . }}
  labels:
    {{- include "agent-sandbox.labels" . | nindent 4 }}
    # Kata sandboxes run untrusted, LLM-generated code — enforce a restricted
    # Pod Security Standard on the namespace as defense in depth.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
