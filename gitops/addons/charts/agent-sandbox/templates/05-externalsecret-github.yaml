{{- /*
CODER GitHub credential, pulled from AWS Secrets Manager into the namespace where
the sandbox VMs run. Mounted read-only at /etc/secrets by 20-sandboxtemplate.yaml.

This is deliberately a SEPARATE credential from the hub-side orchestrator/events
tokens (review C1): the coder VM runs model-written code whose prompt is
attacker-controllable issue text, so it must not hold a token that can merge to
main, push to a protected branch, or administer webhooks.

Required permission: Contents:write on the target repo — and NOTHING else.
  - merging needs Pull requests:write  -> orchestrator only
  - webhook registration needs Webhooks:write -> events only
Contents:write still permits a direct push to a branch, so branch protection on
the default branch is REQUIRED for this boundary to mean anything.

The remote SM secret stores the value under `token`; it is projected to the k8s
key `gh-token` because that is the filename the coder reads at /etc/secrets.

FOLLOW-UP (review C1 as written): this is a standing credential. The stronger
design mints a short-TTL GitHub App installation token per run and injects it via
the SandboxClaim, so the VM never holds a reusable secret. Tracked separately.
*/ -}}
{{- if .Values.coderTemplate.secretsMount.enabled }}
{{- with .Values.coderTemplate.secretsMount.externalSecret }}
{{- if and .enabled .secretManagerKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.coderTemplate.secretsMount.secretName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Before the wave-2 SandboxTemplate/warm pool that mounts it.
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .clusterSecretStore | default "aws-secrets-manager" }}
  refreshInterval: {{ .refreshInterval | default "1h" | quote }}
  target:
    name: {{ $.Values.coderTemplate.secretsMount.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $.Values.coderTemplate.secretsMount.key | default "gh-token" }}
      remoteRef:
        key: {{ .secretManagerKey }}
        property: {{ .property | default "token" }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
{{- end }}
{{- end }}
