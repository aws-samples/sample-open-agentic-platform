apiVersion: v2
name: agent-sandbox
description: >-
  Agent Sandbox capability for the Open Agent Platform — hardware-isolated
  Kata micro-VM sandboxes (agents.x-k8s.io Sandbox CRD) with a pre-warmed pool
  kept ready by a pool-manager controller. The reusable isolation substrate any
  agent workload (e.g. the Dark Factory coding pipeline) can claim on demand.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - kata
  - sandbox
  - isolation
  - micro-vm
  - dark-factory
sources:
  - https://github.com/aws-samples/sample-open-agentic-platform
  - https://github.com/elamaran11/eks-platform-openclaw
maintainers:
  - name: Open Agent Platform
# kata-deploy installs the Kata runtime (binaries, guest kernel, containerd
# runtime handlers for kata-clh/kata-qemu) on the tainted kata MNG nodes.
# Gated by values.kataDeploy.enabled so the chart is inert on clusters without
# a kata-capable nodepool.
dependencies:
  - name: kata-deploy
    version: "3.32.0"
    repository: oci://ghcr.io/kata-containers/kata-deploy-charts
    condition: kataDeploy.enabled
