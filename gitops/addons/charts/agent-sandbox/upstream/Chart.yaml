apiVersion: v2
name: agent-sandbox-operator
description: >-
  Upstream agent-sandbox v0.5.1 operator install (controller Deployment + CRDs +
  RBAC + webhooks) vendored verbatim from kubernetes-sigs/agent-sandbox. Packaged
  as a thin Helm chart so the platform ApplicationSet (which renders addons as
  Helm charts) can deploy it. The manifest files under templates/ contain no Helm
  templating — they are applied as-is. ServerSideApply handles the oversized CRDs.
type: application
version: 0.5.1
appVersion: "0.5.1"
