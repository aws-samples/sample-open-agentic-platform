{{- /*
Hub-side scripts for df-run, in a ConfigMap in the argo namespace, mounted into
the workflow steps (never the Kata VM):
  - review.js  — the shared Security/DevOps reviewer (P3), parameterized by ROLE.
  - status.js  — the sticky-status updater (rewrites the PR body from live verdicts).
Always rendered: the sticky-status step always runs and needs status.js, even if
the review roles are disabled.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: df-review
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
data:
  review.js: |
{{ .Files.Get "scripts/review.js" | indent 4 }}
  status.js: |
{{ .Files.Get "scripts/status.js" | indent 4 }}
  merge.js: |
{{ .Files.Get "scripts/merge.js" | indent 4 }}
  iterate.js: |
{{ .Files.Get "scripts/iterate.js" | indent 4 }}
  comment.js: |
{{ .Files.Get "scripts/comment.js" | indent 4 }}
  deploy-test.sh: |
{{ .Files.Get "scripts/deploy-test.sh" | indent 4 }}
