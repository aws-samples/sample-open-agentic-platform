{{- /*
df-run — the Flow B P1 pipeline as an Argo WorkflowTemplate.

  trigger → claim warm sandbox → coder implements+tests (in the Kata VM) →
  coder opens PR + posts a live sticky status → await human approval.

Single-cluster on the hub: the claim step creates a SandboxClaim with the issue
injected as env (verified contract: envVarsInjectionPolicy=Allowed), waits for
the operator to bind a warm micro-VM (status Ready), then the coder VM — which
boots the coder image from the SandboxTemplate — reads the env, implements on
df/issue-N, builds+tests, pushes, and opens the PR + sticky comment itself using
the short-TTL GitHub token projected into the VM. The workflow watches the coder
pod to completion, then its onExit handler releases the claim (the operator
refills the pool). P1 stops at "PR open, awaiting human" — merge/teardown +
verification gates are P2-P4.

Parameters (supplied by the trigger / Sensor):
  issue-id, issue-number, repo (owner/name), issue-title, issue-body, base-branch
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: df-run
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
spec:
  serviceAccountName: dark-factory-workflow
  # Serialize per issue (no double-claim for the same issue) and cap total
  # concurrent runs against the kata pool size.
  synchronization:
    mutex:
      name: "df-issue-{{`{{workflow.parameters.issue-id}}`}}"
  entrypoint: main
  arguments:
    parameters:
      - name: issue-id
      - name: issue-number
      - name: repo
      - name: issue-title
      - name: issue-body
        value: ""
      - name: base-branch
        value: main
  # Always release the claimed sandbox, on success OR failure.
  onExit: teardown
  ttlStrategy:
    secondsAfterCompletion: 3600
  templates:

    # ---- DAG ----
    # claim → coder → [ verify fan: holdout-gate ∥ security-review ∥ devops-review ]
    # → status. Every verify step runs OUTSIDE the coder (trusted hub pod), is gated
    # on a PR existing, and is advisory in v1 (posts a commit status; never fails the
    # run unless its *.blocking / blockSeverity is raised). `status` waits for all
    # enabled verify steps via its dependencies list.
    - name: main
      dag:
        tasks:
          - name: claim
            template: claim-sandbox
          - name: drive-coder
            template: await-coder
            dependencies: [claim]
            arguments:
              parameters:
                - name: sandbox
                  value: "{{`{{tasks.claim.outputs.parameters.sandbox}}`}}"
{{- if .Values.holdout.enabled }}
          # P2 — holdout gate: hidden scenarios + a different-family judge.
          - name: holdout-gate
            template: holdout-gate
            dependencies: [drive-coder]
            when: "{{`{{tasks.drive-coder.outputs.parameters.pr-number}}`}} != \"\""
            arguments:
              parameters:
                - name: pr-number
                  value: "{{`{{tasks.drive-coder.outputs.parameters.pr-number}}`}}"
{{- end }}
{{- if .Values.review.enabled }}
          # P3 — independent, read-only reviewers. Parallel with the holdout gate.
          - name: security-review
            template: review-role
            dependencies: [drive-coder]
            when: "{{`{{tasks.drive-coder.outputs.parameters.pr-number}}`}} != \"\""
            arguments:
              parameters:
                - name: role
                  value: security
                - name: backend
                  value: "{{ .Values.review.security.backend }}"
          - name: devops-review
            template: review-role
            dependencies: [drive-coder]
            when: "{{`{{tasks.drive-coder.outputs.parameters.pr-number}}`}} != \"\""
            arguments:
              parameters:
                - name: role
                  value: devops
                - name: backend
                  value: "{{ .Values.review.devops.backend }}"
{{- end }}
          - name: status
            template: sticky-status
            dependencies:
              {{- if or .Values.holdout.enabled .Values.review.enabled }}
              {{- if .Values.holdout.enabled }}
              - holdout-gate
              {{- end }}
              {{- if .Values.review.enabled }}
              - security-review
              - devops-review
              {{- end }}
              {{- else }}
              - drive-coder
              {{- end }}
            arguments:
              parameters:
                - name: phase
                  value: "pr-open"

    # ---- 1. Claim a warm sandbox (creates the SandboxClaim with issue env) ----
    - name: claim-sandbox
      outputs:
        parameters:
          - name: sandbox
            valueFrom:
              jsonPath: "{.status.sandbox.name}"
      resource:
        action: create
        setOwnerReference: false
        successCondition: status.conditions.0.status == True
        failureCondition: status.conditions.0.reason == EnvVarsInjectionRejected
        manifest: |
          apiVersion: extensions.agents.x-k8s.io/v1beta1
          kind: SandboxClaim
          metadata:
            name: df-issue-{{`{{workflow.parameters.issue-id}}`}}
            namespace: {{ .Values.warmPool.namespace }}
            labels:
              dark-factory.io/issue: "{{`{{workflow.parameters.issue-id}}`}}"
              dark-factory.io/managed-by: df-run
          spec:
            warmPoolRef:
              name: {{ .Values.warmPool.name }}
            lifecycle:
              ttlSecondsAfterFinished: {{ .Values.claimTtlSeconds }}
            env:
              - { containerName: coder, name: DF_ISSUE_NUMBER, value: "{{`{{workflow.parameters.issue-number}}`}}" }
              - { containerName: coder, name: DF_REPO, value: "{{`{{workflow.parameters.repo}}`}}" }
              - { containerName: coder, name: DF_BRANCH, value: "df/issue-{{`{{workflow.parameters.issue-number}}`}}" }
              - { containerName: coder, name: DF_BASE_BRANCH, value: "{{`{{workflow.parameters.base-branch}}`}}" }
              - { containerName: coder, name: DF_ISSUE_TITLE, value: "{{`{{workflow.parameters.issue-title}}`}}" }
              - { containerName: coder, name: CODER_PROFILE, value: "{{ .Values.coder.profile }}" }
              - { containerName: coder, name: BIFROST_URL, value: "{{ .Values.bifrost.url }}" }

    # ---- 2. Wait for the coder VM to finish — GitHub is the completion bus ----
    # The coder image (baked into the SandboxTemplate) auto-runs on VM start,
    # reads DF_* env, implements + tests, pushes df/issue-N, and opens the PR
    # itself using the short-TTL gh-token projected into the VM. The coder is
    # credential-less to the k8s API (no SA token), so it CANNOT signal via a pod
    # annotation — it self-reports through GitHub. This step polls the GitHub API
    # (with the workflow's own token) for a PR whose head is df/issue-N, and
    # treats the head commit's dark-factory/implementation check as the verdict.
    - name: await-coder
      inputs:
        parameters:
          - name: sandbox
      activeDeadlineSeconds: {{ mul .Values.coder.runTimeoutMinutes 60 }}
      script:
        image: {{ .Values.stepImage }}
        command: [sh]
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.github.tokenSecret }}
                key: {{ .Values.github.tokenKey }}
        source: |
          set -eu
          command -v curl >/dev/null 2>&1 || apk add --no-cache curl jq >/dev/null 2>&1
          REPO="{{`{{workflow.parameters.repo}}`}}"
          BRANCH="df/issue-{{`{{workflow.parameters.issue-number}}`}}"
          API="https://api.github.com/repos/${REPO}"
          echo "[df-run] polling GitHub for PR head=${BRANCH} in ${REPO}..."
          while true; do
            # Is there an open PR from the coder's branch?
            pr="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   "${API}/pulls?head=${REPO%%/*}:${BRANCH}&state=open" 2>/dev/null || echo '[]')"
            n="$(echo "${pr}" | jq -r '.[0].number // empty')"
            if [ -n "${n}" ]; then
              # Read the coder's self-reported implementation status on the head SHA.
              sha="$(echo "${pr}" | jq -r '.[0].head.sha')"
              st="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                     "${API}/commits/${sha}/status" 2>/dev/null | jq -r '.statuses[] | select(.context=="dark-factory/implementation") | .state' | head -1)"
              echo "[df-run] PR #${n} open (sha=${sha}) impl-status=${st:-pending}"
              case "${st}" in
                success) echo "[df-run] coder finished — PR #${n} ready."; echo "${n}" > /tmp/pr; exit 0 ;;
                failure|error) echo "[df-run] coder reported failure."; exit 1 ;;
              esac
            else
              echo "[df-run] no PR yet — coder still working..."
            fi
            sleep 15
          done
      outputs:
        parameters:
          - name: pr-number
            valueFrom:
              path: /tmp/pr
              default: ""

{{- if .Values.holdout.enabled }}
    # ---- 2b. Holdout gate (P2) — train/test separation for code ----
    # Runs on the HUB (a trusted step, NOT the Kata VM). Checks out the coder's
    # PR branch, diffs it vs base, then runs evaluate.js: each hidden scenario
    # gets its executable test run against the built code AND a different-family
    # judge (Nova) vote (2-of-3). Gate = passRatio >= threshold. The hidden
    # scenarios come from the df-holdout-* ConfigMaps mounted here — they are
    # NEVER mounted into the sandbox, so the coder cannot see or edit them.
    # v1 is advisory: the gate result is posted as the dark-factory/holdout commit
    # status; the workflow only fails on a red gate when holdout.blocking=true.
    - name: holdout-gate
      inputs:
        parameters:
          - name: pr-number
      activeDeadlineSeconds: 900
      volumes:
        - name: holdout-eval
          configMap:
            name: df-holdout-eval
        {{- range $repo := .Values.trigger.argoEvents.repositories }}
        {{- range $name := $repo.names }}
        - name: holdout-{{ printf "%s-%s" $repo.owner $name | lower }}
          configMap:
            name: df-holdout-{{ printf "%s-%s" $repo.owner $name | lower }}
        {{- end }}
        {{- end }}
      script:
        image: {{ .Values.holdout.evalImage }}
        command: [bash]
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.github.tokenSecret }}
                key: {{ .Values.github.tokenKey }}
          - name: BIFROST_URL
            value: {{ .Values.holdout.bifrostUrl | quote }}
          - name: JUDGE_MODEL
            value: {{ .Values.holdout.judgeModel | quote }}
          - name: JUDGE_RUNS
            value: {{ .Values.holdout.judgeRuns | quote }}
          - name: JUDGE_QUORUM
            value: {{ .Values.holdout.judgeQuorum | quote }}
          - name: THRESHOLD
            value: {{ .Values.holdout.threshold | quote }}
        volumeMounts:
          - name: holdout-eval
            mountPath: /holdout/evaluate.js
            subPath: evaluate.js
          {{- range $repo := .Values.trigger.argoEvents.repositories }}
          {{- range $name := $repo.names }}
          - name: holdout-{{ printf "%s-%s" $repo.owner $name | lower }}
            mountPath: /holdout/{{ printf "%s-%s" $repo.owner $name }}
          {{- end }}
          {{- end }}
        source: |
          set -eu
          REPO="{{`{{workflow.parameters.repo}}`}}"
          BRANCH="df/issue-{{`{{workflow.parameters.issue-number}}`}}"
          BASE="{{`{{workflow.parameters.base-branch}}`}}"
          SLUG="$(echo "${REPO}" | tr '/' '-')"
          API="https://api.github.com/repos/${REPO}"
          WORK=/tmp/holdout-work
          rm -rf "${WORK}"; mkdir -p "${WORK}"
          echo "[holdout] cloning ${REPO}@${BRANCH} for evaluation..."
          git clone --quiet --branch "${BRANCH}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "${WORK}/repo"
          cd "${WORK}/repo"
          # Diff vs base for the judge (fetch base if the shallow clone lacks it).
          git fetch --quiet --depth 1 origin "${BASE}" || true
          git diff "origin/${BASE}...HEAD" > /tmp/diff.patch 2>/dev/null || git diff HEAD~1 > /tmp/diff.patch 2>/dev/null || echo "" > /tmp/diff.patch
          # Build/install so executable tests can require the module.
          if [ -f package.json ]; then npm install --no-audit --no-fund >/dev/null 2>&1 || true; fi
          SHA="$(git rev-parse HEAD)"

          SCEN="/holdout/${SLUG}/scenarios.json"
          if [ ! -f "${SCEN}" ]; then
            echo "[holdout] no hidden scenarios for ${SLUG} — skipping gate (advisory)."
            exit 0
          fi

          echo "[holdout] evaluating against hidden scenarios..."
          set +e
          REPO_DIR="${WORK}/repo" DIFF=/tmp/diff.patch SCENARIOS="${SCEN}" \
            OUT=/tmp/holdout-result.json node /holdout/evaluate.js
          GATE=$?
          set -e

          RATIO="$(node -e 'const r=require("/tmp/holdout-result.json");console.log(Math.round(r.ratio*100))' 2>/dev/null || echo 0)"
          PASSED="$(node -e 'const r=require("/tmp/holdout-result.json");console.log(r.passed+"/"+r.total)' 2>/dev/null || echo '?/?')"
          if [ "${GATE}" -eq 0 ]; then STATE=success; DESC="holdout ${PASSED} (${RATIO}%) — gate passed"; else STATE=failure; DESC="holdout ${PASSED} (${RATIO}%) — below threshold"; fi

          # Post the holdout verdict as a commit status on the PR head SHA. The
          # coder image has no curl, so use node's https (always present). Retry
          # transient failures so a blip doesn't drop the verdict.
          GH_TOKEN="${GH_TOKEN}" REPO="${REPO}" SHA="${SHA}" STATE="${STATE}" DESC="${DESC}" node -e '
            const https=require("https");
            const body=JSON.stringify({state:process.env.STATE,context:"dark-factory/holdout",description:process.env.DESC});
            let n=0;
            (function post(){
              const req=https.request({host:"api.github.com",method:"POST",path:"/repos/"+process.env.REPO+"/statuses/"+process.env.SHA,
                headers:{"User-Agent":"dark-factory-holdout","Authorization":"Bearer "+process.env.GH_TOKEN,"Accept":"application/vnd.github+json","Content-Type":"application/json","Content-Length":Buffer.byteLength(body)}},
                r=>{let b="";r.on("data",c=>b+=c);r.on("end",()=>{if(r.statusCode>=300&&r.statusCode<500){console.error("status post "+r.statusCode+": "+b.slice(0,120))}else if(r.statusCode>=500&&++n<4){setTimeout(post,500*n);return} console.log("[holdout] posted dark-factory/holdout="+process.env.STATE)});});
              req.on("error",e=>{if(++n<4){setTimeout(post,500*n)}else{console.error("status post error: "+e.message)}});
              req.write(body);req.end();
            })();
          ' || true

          {{- if .Values.holdout.blocking }}
          echo "[holdout] blocking mode — gate result gates the workflow."
          exit ${GATE}
          {{- else }}
          echo "[holdout] advisory mode — gate result reported, workflow continues."
          exit 0
          {{- end }}
      outputs:
        parameters:
          - name: ratio
            valueFrom:
              path: /tmp/holdout-result.json
              default: "{}"
{{- end }}

{{- if .Values.review.enabled }}
    # ---- 2c. Review role (P3) — Security / DevOps, parameterized by `role` ----
    # A trusted hub-side, READ-ONLY reviewer on the coder's diff (docs §6.2). It
    # clones df/issue-N, diffs vs base, and runs review.js with the given role +
    # backend (auto = deterministic linters as the hard signal + a different-family
    # Nova LLM reviewer as advisory). Posts dark-factory/<role> commit status.
    # Advisory in v1: only fails the workflow if review.blockSeverity is raised and
    # a finding meets that bar. Never runs in the coder VM; the coder never grades
    # itself (separation of concerns — anti-pattern #4).
    - name: review-role
      inputs:
        parameters:
          - name: role
          - name: backend
      activeDeadlineSeconds: 600
      volumes:
        - name: review-script
          configMap:
            name: df-review
      script:
        image: {{ .Values.review.reviewImage }}
        command: [bash]
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.github.tokenSecret }}
                key: {{ .Values.github.tokenKey }}
          - name: ROLE
            value: "{{`{{inputs.parameters.role}}`}}"
          - name: BACKEND
            value: "{{`{{inputs.parameters.backend}}`}}"
          - name: BIFROST_URL
            value: {{ .Values.review.bifrostUrl | quote }}
          - name: REVIEW_MODEL
            value: {{ .Values.review.reviewModel | quote }}
          - name: BLOCK_SEVERITY
            value: {{ .Values.review.blockSeverity | quote }}
        volumeMounts:
          - name: review-script
            mountPath: /review/review.js
            subPath: review.js
        source: |
          set -eu
          ROLE="{{`{{inputs.parameters.role}}`}}"
          REPO="{{`{{workflow.parameters.repo}}`}}"
          BRANCH="df/issue-{{`{{workflow.parameters.issue-number}}`}}"
          BASE="{{`{{workflow.parameters.base-branch}}`}}"
          WORK=/tmp/review-${ROLE}
          rm -rf "${WORK}"; mkdir -p "${WORK}"
          echo "[review:${ROLE}] cloning ${REPO}@${BRANCH} (read-only review)..."
          git clone --quiet --branch "${BRANCH}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "${WORK}/repo"
          cd "${WORK}/repo"
          git fetch --quiet --depth 1 origin "${BASE}" || true
          git diff "origin/${BASE}...HEAD" > /tmp/diff-${ROLE}.patch 2>/dev/null || git diff HEAD~1 > /tmp/diff-${ROLE}.patch 2>/dev/null || echo "" > /tmp/diff-${ROLE}.patch
          SHA="$(git rev-parse HEAD)"

          set +e
          REPO_DIR="${WORK}/repo" DIFF=/tmp/diff-${ROLE}.patch OUT=/tmp/review-${ROLE}.json \
            node /review/review.js
          RC=$?
          set -e

          TOP="$(node -e 'const r=require("/tmp/review-'"${ROLE}"'.json");console.log(r.topSeverity+" | "+r.total)' 2>/dev/null || echo 'none | 0')"
          TOPSEV="${TOP%% *}"; NUM="${TOP##* }"
          if [ "${RC}" -eq 0 ]; then STATE=success; else STATE=failure; fi
          if [ "${NUM}" = "0" ]; then DESC="${ROLE}: no findings"; else DESC="${ROLE}: ${NUM} finding(s), top=${TOPSEV}"; fi

          # Post dark-factory/<role> commit status (node https — no curl in image).
          GH_TOKEN="${GH_TOKEN}" REPO="${REPO}" SHA="${SHA}" STATE="${STATE}" DESC="${DESC}" ROLE="${ROLE}" node -e '
            const https=require("https");
            const body=JSON.stringify({state:process.env.STATE,context:"dark-factory/"+process.env.ROLE,description:process.env.DESC});
            let n=0;
            (function post(){
              const req=https.request({host:"api.github.com",method:"POST",path:"/repos/"+process.env.REPO+"/statuses/"+process.env.SHA,
                headers:{"User-Agent":"dark-factory-review","Authorization":"Bearer "+process.env.GH_TOKEN,"Accept":"application/vnd.github+json","Content-Type":"application/json","Content-Length":Buffer.byteLength(body)}},
                r=>{let b="";r.on("data",c=>b+=c);r.on("end",()=>{if(r.statusCode>=300&&r.statusCode<500){console.error("status post "+r.statusCode+": "+b.slice(0,120))}else if(r.statusCode>=500&&++n<4){setTimeout(post,500*n);return} console.log("[review:"+process.env.ROLE+"] posted dark-factory/"+process.env.ROLE+"="+process.env.STATE)});});
              req.on("error",e=>{if(++n<4){setTimeout(post,500*n)}else{console.error("status post error: "+e.message)}});
              req.write(body);req.end();
            })();
          ' || true
          # Advisory in v1: exit 0 unless review.blockSeverity made review.js exit non-zero.
          exit ${RC}
      outputs:
        parameters:
          - name: report
            valueFrom:
              path: /tmp/review-{{`{{inputs.parameters.role}}`}}.json
              default: "{}"
{{- end }}

    # ---- 3. Sticky status (workflow-side backstop; the coder posts primary) ----
    - name: sticky-status
      inputs:
        parameters:
          - name: phase
      script:
        image: {{ .Values.stepImage }}
        command: [sh]
        source: |
          set -eu
          echo "[df-run] pipeline reached phase={{`{{inputs.parameters.phase}}`}} for issue #{{`{{workflow.parameters.issue-number}}`}}"
          echo "[df-run] PR is open and awaiting human review (P1 stops here)."

    # ---- onExit: release the claim (operator refills the pool) ----
    - name: teardown
      resource:
        action: delete
        flags: ["--ignore-not-found"]
        manifest: |
          apiVersion: extensions.agents.x-k8s.io/v1beta1
          kind: SandboxClaim
          metadata:
            name: df-issue-{{`{{workflow.parameters.issue-id}}`}}
            namespace: {{ .Values.warmPool.namespace }}
