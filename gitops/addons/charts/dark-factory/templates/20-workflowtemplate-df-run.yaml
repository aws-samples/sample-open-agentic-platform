{{- /*
df-run — the Flow B P1 pipeline as an Argo WorkflowTemplate.

  trigger → claim warm sandbox → coder implements+tests (in the Kata VM) →
  coder opens PR + posts a live sticky status → await human approval.

Single-cluster on the hub: the claim step creates a SandboxClaim with the issue
injected as env (verified contract: envVarsInjectionPolicy=Allowed), waits for
the operator to bind a warm micro-VM (status Ready), then the coder VM — which
boots the coder image from the SandboxTemplate — reads the env, implements on
df/issue-N, builds+tests, pushes, and opens the PR + sticky comment itself using
the short-TTL GitHub token projected into the VM. The workflow watches the coder
pod to completion, then its onExit handler releases the claim (the operator
refills the pool). P1 stops at "PR open, awaiting human" — merge/teardown +
verification gates are P2-P4.

Parameters (supplied by the trigger / Sensor):
  issue-id, issue-number, repo (owner/name), issue-title, issue-body, base-branch
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: df-run
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
spec:
  serviceAccountName: dark-factory-workflow
  # Serialize per issue (no double-claim for the same issue) and cap total
  # concurrent runs against the kata pool size.
  synchronization:
    mutex:
      name: "df-issue-{{`{{workflow.parameters.issue-id}}`}}"
  entrypoint: main
  arguments:
    parameters:
      - name: issue-id
      - name: issue-number
      - name: repo
      - name: issue-title
      - name: issue-body
        value: ""
      - name: base-branch
        value: main
      # Optional revision request (df-iterate passes the PR comment here; empty on
      # a first pass). Injected into the coder as DF_ITERATE_NOTE so it revises the
      # existing branch to address the feedback.
      - name: iterate-note
        value: ""
  # Always release the claimed sandbox, on success OR failure.
  onExit: teardown
  ttlStrategy:
    secondsAfterCompletion: 3600
{{- if .Values.metrics.enabled }}
  # Success metrics (Argo-native Prometheus). Argo exposes these on the workflow
  # controller's :9090/metrics — scraped into the platform Prometheus. Gives the
  # GitOps-native view of the factory: throughput, outcome mix, and lead time.
  metrics:
    prometheus:
      - name: df_runs_total
        help: "Dark Factory df-run workflows by status"
        labels:
          - { key: status, value: "{{`{{workflow.status}}`}}" }
        counter:
          value: "1"
      - name: df_run_duration_seconds
        help: "df-run wall-clock duration (lead time proxy)"
        gauge:
          value: "{{`{{workflow.duration}}`}}"
{{- end }}
  templates:

    # ---- DAG ----
    # claim → coder → [ verify fan: holdout-gate ∥ security-review ∥ devops-review ]
    # → status. Every verify step runs OUTSIDE the coder (trusted hub pod), is gated
    # on a PR existing, and is advisory in v1 (posts a commit status; never fails the
    # run unless its *.blocking / blockSeverity is raised). `status` waits for all
    # enabled verify steps via its dependencies list.
    - name: main
      dag:
        tasks:
          - name: claim
            template: claim-sandbox
          - name: drive-coder
            template: await-coder
            dependencies: [claim]
            arguments:
              parameters:
                - name: sandbox
                  value: "{{`{{tasks.claim.outputs.parameters.sandbox}}`}}"
{{- if .Values.holdout.enabled }}
          # P2 — holdout gate: hidden scenarios + a different-family judge.
          - name: holdout-gate
            template: holdout-gate
            dependencies: [drive-coder]
            when: "{{`{{tasks.drive-coder.outputs.parameters.pr-number}}`}} != \"\""
            arguments:
              parameters:
                - name: pr-number
                  value: "{{`{{tasks.drive-coder.outputs.parameters.pr-number}}`}}"
{{- end }}
{{- if .Values.review.enabled }}
          # P3 — REAL AWS Frontier Agents, ordered: DevOps FIRST, then Security.
          #
          # DevOps Agent (release readiness) runs via the Claude Code plugin INSIDE
          # the coder step (no headless API), so there is no separate DAG task for
          # it here — its verdict is reported by the coder and, on a clear verdict,
          # the coder applies the `needs-security-review` label. This `devops-gate`
          # step confirms the label is present (DevOps cleared) before Security runs.
          - name: devops-gate
            template: devops-gate
            dependencies: [drive-coder]
            when: "{{`{{tasks.drive-coder.outputs.parameters.pr-number}}`}} != \"\""
          # Security Agent (narrow/strict) runs SECOND — only after DevOps cleared
          # (label present). Headless: create-code-review → job → list-findings.
          - name: security-agent
            template: security-agent
            dependencies: [devops-gate]
            when: "{{`{{tasks.devops-gate.outputs.parameters.cleared}}`}} == true"
{{- end }}
{{- if .Values.deployTest.enabled }}
          # P4 — detect whether the PR touches deployable artifacts (cheap grep of
          # the diff). Its output gates the (expensive, K8s-touching) deploy-test.
          - name: detect-deployable
            template: detect-deployable
            dependencies: [drive-coder]
            when: "{{`{{tasks.drive-coder.outputs.parameters.pr-number}}`}} != \"\""
          # P4 — deploy-test: THE ONLY step that holds K8s access. Content-aware:
          # k8s → ephemeral-namespace apply+probe+teardown; terraform → init+validate.
          # Runs only when detect classified the change (kind != none).
          - name: deploy-test
            template: deploy-test
            dependencies: [detect-deployable]
            when: "{{`{{tasks.detect-deployable.outputs.parameters.kind}}`}} != none"
            arguments:
              parameters:
                - name: kind
                  value: "{{`{{tasks.detect-deployable.outputs.parameters.kind}}`}}"
{{- end }}
          - name: status
            template: sticky-status
            dependencies:
              {{- if or .Values.holdout.enabled .Values.review.enabled .Values.deployTest.enabled }}
              {{- if .Values.holdout.enabled }}
              - holdout-gate
              {{- end }}
              {{- if .Values.review.enabled }}
              - security-agent
              {{- end }}
              {{- if .Values.deployTest.enabled }}
              - deploy-test
              {{- end }}
              {{- else }}
              - drive-coder
              {{- end }}
            arguments:
              parameters:
                - name: phase
                  value: "pr-open"

    # ---- 1. Claim a warm sandbox (creates the SandboxClaim with issue env) ----
    - name: claim-sandbox
      outputs:
        parameters:
          - name: sandbox
            valueFrom:
              jsonPath: "{.status.sandbox.name}"
      resource:
        action: create
        setOwnerReference: false
        successCondition: status.conditions.0.status == True
        failureCondition: status.conditions.0.reason == EnvVarsInjectionRejected
        manifest: |
          apiVersion: extensions.agents.x-k8s.io/v1beta1
          kind: SandboxClaim
          metadata:
            name: df-issue-{{`{{workflow.parameters.issue-id}}`}}
            namespace: {{ .Values.warmPool.namespace }}
            labels:
              dark-factory.io/issue: "{{`{{workflow.parameters.issue-id}}`}}"
              # issue NUMBER too: df-merge-teardown / df-iterate are fired by PR
              # events whose payload carries the branch (df/issue-<number>) but NOT
              # the issue id, so they select the claim to reap by this label.
              dark-factory.io/issue-number: "{{`{{workflow.parameters.issue-number}}`}}"
              dark-factory.io/managed-by: df-run
          spec:
            warmPoolRef:
              name: {{ .Values.warmPool.name }}
            lifecycle:
              ttlSecondsAfterFinished: {{ .Values.claimTtlSeconds }}
            env:
              - { containerName: coder, name: DF_ISSUE_NUMBER, value: "{{`{{workflow.parameters.issue-number}}`}}" }
              - { containerName: coder, name: DF_REPO, value: "{{`{{workflow.parameters.repo}}`}}" }
              - { containerName: coder, name: DF_BRANCH, value: "df/issue-{{`{{workflow.parameters.issue-number}}`}}" }
              - { containerName: coder, name: DF_BASE_BRANCH, value: "{{`{{workflow.parameters.base-branch}}`}}" }
              - { containerName: coder, name: DF_ISSUE_TITLE, value: "{{`{{workflow.parameters.issue-title}}`}}" }
              # Engine the coder VM runs: claude (default) | kiro. entrypoint.js
              # branches on this (=="kiro" → kiro headless, else claude -p).
              - { containerName: coder, name: CODER_ENGINE, value: "{{ .Values.coder.engine }}" }
              # Back-compat alias (older coder images read CODER_PROFILE).
              - { containerName: coder, name: CODER_PROFILE, value: "{{ .Values.coder.engine }}" }
              - { containerName: coder, name: BIFROST_URL, value: "{{ .Values.bifrost.url }}" }
              - { containerName: coder, name: DF_ITERATE_NOTE, value: "{{`{{workflow.parameters.iterate-note}}`}}" }
{{- if and .Values.devopsAgent.enabled (eq .Values.devopsAgent.gate "label") }}
              # DevOps Agent via the coding-agent plugin, run inside the coder
              # step BEFORE the PR opens — ONLY in label-gate mode. In the default
              # check-gate mode the DevOps Agent GitHub App reviews the PR instead,
              # so the coder does not attempt the (VM-incompatible) plugin path.
              - { containerName: coder, name: DF_DEVOPS_AGENT_MODE, value: "claude-plugin" }
              - { containerName: coder, name: DF_DEVOPS_CLEAR_LABEL, value: "{{ .Values.review.handoffLabel }}" }
{{- end }}

    # ---- 2. Wait for the coder VM to finish — GitHub is the completion bus ----
    # The coder image (baked into the SandboxTemplate) auto-runs on VM start,
    # reads DF_* env, implements + tests, pushes df/issue-N, and opens the PR
    # itself using the short-TTL gh-token projected into the VM. The coder is
    # credential-less to the k8s API (no SA token), so it CANNOT signal via a pod
    # annotation — it self-reports through GitHub. This step polls the GitHub API
    # (with the workflow's own token) for a PR whose head is df/issue-N, and
    # treats the head commit's dark-factory/implementation check as the verdict.
    - name: await-coder
      inputs:
        parameters:
          - name: sandbox
      activeDeadlineSeconds: {{ mul .Values.coder.runTimeoutMinutes 60 }}
      script:
        image: {{ .Values.stepImage }}
        command: [sh]
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.github.tokenSecret }}
                key: {{ .Values.github.tokenKey }}
        source: |
          set -eu
          command -v curl >/dev/null 2>&1 || apk add --no-cache curl jq >/dev/null 2>&1
          REPO="{{`{{workflow.parameters.repo}}`}}"
          BRANCH="df/issue-{{`{{workflow.parameters.issue-number}}`}}"
          API="https://api.github.com/repos/${REPO}"
          echo "[df-run] polling GitHub for PR head=${BRANCH} in ${REPO}..."
          while true; do
            # Is there an open PR from the coder's branch?
            pr="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   "${API}/pulls?head=${REPO%%/*}:${BRANCH}&state=open" 2>/dev/null || echo '[]')"
            n="$(echo "${pr}" | jq -r '.[0].number // empty')"
            if [ -n "${n}" ]; then
              # Read the coder's self-reported implementation status on the head SHA.
              sha="$(echo "${pr}" | jq -r '.[0].head.sha')"
              st="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                     "${API}/commits/${sha}/status" 2>/dev/null | jq -r '.statuses[] | select(.context=="dark-factory/implementation") | .state' | head -1)"
              echo "[df-run] PR #${n} open (sha=${sha}) impl-status=${st:-pending}"
              case "${st}" in
                success) echo "[df-run] coder finished — PR #${n} ready."; echo "${n}" > /tmp/pr; exit 0 ;;
                failure|error) echo "[df-run] coder reported failure."; exit 1 ;;
              esac
            else
              echo "[df-run] no PR yet — coder still working..."
            fi
            sleep 15
          done
      outputs:
        parameters:
          - name: pr-number
            valueFrom:
              path: /tmp/pr
              default: ""

{{- if .Values.holdout.enabled }}
    # ---- 2b. Holdout gate (P2) — train/test separation for code ----
    # Runs on the HUB (a trusted step, NOT the Kata VM). Checks out the coder's
    # PR branch, diffs it vs base, then runs evaluate.js: each hidden scenario
    # gets its executable test run against the built code AND a different-family
    # judge (Nova) vote (2-of-3). Gate = passRatio >= threshold. The hidden
    # scenarios come from the df-holdout-* ConfigMaps mounted here — they are
    # NEVER mounted into the sandbox, so the coder cannot see or edit them.
    # v1 is advisory: the gate result is posted as the dark-factory/holdout commit
    # status; the workflow only fails on a red gate when holdout.blocking=true.
    - name: holdout-gate
      inputs:
        parameters:
          - name: pr-number
      activeDeadlineSeconds: 900
      volumes:
        - name: holdout-eval
          configMap:
            name: df-holdout-eval
        {{- range $repo := .Values.trigger.argoEvents.repositories }}
        {{- range $name := $repo.names }}
        - name: holdout-{{ printf "%s-%s" $repo.owner $name | lower }}
          configMap:
            name: df-holdout-{{ printf "%s-%s" $repo.owner $name | lower }}
        {{- end }}
        {{- end }}
      script:
        image: {{ .Values.holdout.evalImage }}
        command: [bash]
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.github.tokenSecret }}
                key: {{ .Values.github.tokenKey }}
          - name: BIFROST_URL
            value: {{ .Values.holdout.bifrostUrl | quote }}
          - name: JUDGE_MODEL
            value: {{ .Values.holdout.judgeModel | quote }}
          - name: JUDGE_RUNS
            value: {{ .Values.holdout.judgeRuns | quote }}
          - name: JUDGE_QUORUM
            value: {{ .Values.holdout.judgeQuorum | quote }}
          - name: THRESHOLD
            value: {{ .Values.holdout.threshold | quote }}
        volumeMounts:
          - name: holdout-eval
            mountPath: /holdout/evaluate.js
            subPath: evaluate.js
          {{- range $repo := .Values.trigger.argoEvents.repositories }}
          {{- range $name := $repo.names }}
          - name: holdout-{{ printf "%s-%s" $repo.owner $name | lower }}
            mountPath: /holdout/{{ printf "%s-%s" $repo.owner $name }}
          {{- end }}
          {{- end }}
        source: |
          set -eu
          REPO="{{`{{workflow.parameters.repo}}`}}"
          BRANCH="df/issue-{{`{{workflow.parameters.issue-number}}`}}"
          BASE="{{`{{workflow.parameters.base-branch}}`}}"
          SLUG="$(echo "${REPO}" | tr '/' '-')"
          API="https://api.github.com/repos/${REPO}"
          WORK=/tmp/holdout-work
          rm -rf "${WORK}"; mkdir -p "${WORK}"
          echo "[holdout] cloning ${REPO}@${BRANCH} for evaluation..."
          git clone --quiet --branch "${BRANCH}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "${WORK}/repo"
          cd "${WORK}/repo"
          # Diff vs base for the judge (fetch base if the shallow clone lacks it).
          git fetch --quiet --depth 1 origin "${BASE}" || true
          git diff "origin/${BASE}...HEAD" > /tmp/diff.patch 2>/dev/null || git diff HEAD~1 > /tmp/diff.patch 2>/dev/null || echo "" > /tmp/diff.patch
          # Build/install so executable tests can require the module.
          if [ -f package.json ]; then npm install --no-audit --no-fund >/dev/null 2>&1 || true; fi
          SHA="$(git rev-parse HEAD)"

          SCEN="/holdout/${SLUG}/scenarios.json"
          if [ ! -f "${SCEN}" ]; then
            echo "[holdout] no hidden scenarios for ${SLUG} — skipping gate (advisory)."
            exit 0
          fi

          echo "[holdout] evaluating against hidden scenarios..."
          set +e
          REPO_DIR="${WORK}/repo" DIFF=/tmp/diff.patch SCENARIOS="${SCEN}" \
            OUT=/tmp/holdout-result.json node /holdout/evaluate.js
          GATE=$?
          set -e

          RATIO="$(node -e 'const r=require("/tmp/holdout-result.json");console.log(Math.round(r.ratio*100))' 2>/dev/null || echo 0)"
          PASSED="$(node -e 'const r=require("/tmp/holdout-result.json");console.log(r.passed+"/"+r.total)' 2>/dev/null || echo '?/?')"
          if [ "${GATE}" -eq 0 ]; then STATE=success; DESC="holdout ${PASSED} (${RATIO}%) — gate passed"; else STATE=failure; DESC="holdout ${PASSED} (${RATIO}%) — below threshold"; fi

          # Post the holdout verdict as a commit status on the PR head SHA. The
          # coder image has no curl, so use node's https (always present). Retry
          # transient failures so a blip doesn't drop the verdict.
          GH_TOKEN="${GH_TOKEN}" REPO="${REPO}" SHA="${SHA}" STATE="${STATE}" DESC="${DESC}" node -e '
            const https=require("https");
            const body=JSON.stringify({state:process.env.STATE,context:"dark-factory/holdout",description:process.env.DESC});
            let n=0;
            (function post(){
              const req=https.request({host:"api.github.com",method:"POST",path:"/repos/"+process.env.REPO+"/statuses/"+process.env.SHA,
                headers:{"User-Agent":"dark-factory-holdout","Authorization":"Bearer "+process.env.GH_TOKEN,"Accept":"application/vnd.github+json","Content-Type":"application/json","Content-Length":Buffer.byteLength(body)}},
                r=>{let b="";r.on("data",c=>b+=c);r.on("end",()=>{if(r.statusCode>=300&&r.statusCode<500){console.error("status post "+r.statusCode+": "+b.slice(0,120))}else if(r.statusCode>=500&&++n<4){setTimeout(post,500*n);return} console.log("[holdout] posted dark-factory/holdout="+process.env.STATE)});});
              req.on("error",e=>{if(++n<4){setTimeout(post,500*n)}else{console.error("status post error: "+e.message)}});
              req.write(body);req.end();
            })();
          ' || true

          {{- if .Values.holdout.blocking }}
          echo "[holdout] blocking mode — gate result gates the workflow."
          exit ${GATE}
          {{- else }}
          echo "[holdout] advisory mode — gate result reported, workflow continues."
          exit 0
          {{- end }}
      outputs:
        parameters:
          - name: ratio
            valueFrom:
              path: /tmp/holdout-result.json
              default: "{}"
{{- end }}

{{- if .Values.review.enabled }}
    # ---- 2c. devops-gate (P3, step 1) — wait for the AWS DevOps Agent to clear ----
    # The AWS DevOps Agent release-readiness review is its own GitHub App that
    # auto-reviews every PR and posts a check-run / commit status (its native model
    # — there is NO headless code-review API). This step polls the PR head for that
    # check and emits cleared=true|false, which gates the Security Agent step so
    # DevOps reviews FIRST, Security SECOND (docs §6.2).
    #
    # Mode (devopsAgent.gate):
    #   check   → wait for the DevOps Agent's own check-run (context matches
    #             devopsAgent.checkContext) to conclude success/neutral. This is the
    #             real GitHub-App path (needs the one-time console repo connect).
    #   label   → fallback: wait for the coder-applied handoffLabel (used only if
    #             you drive DevOps via the coding-agent plugin instead of the App).
    # If DevOps never reports within the window, cleared=false → Security is skipped
    # and the sticky status shows DevOps not-run (NEVER a fake pass). Advisory: this
    # step itself never fails the run.
    - name: devops-gate
      activeDeadlineSeconds: {{ add .Values.devopsAgent.waitSeconds 60 }}
      script:
        image: {{ .Values.reviewImage }}
        command: [bash]
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.github.tokenSecret }}
                key: {{ .Values.github.tokenKey }}
          - name: REPO
            value: "{{`{{workflow.parameters.repo}}`}}"
          - name: PR
            value: "{{`{{tasks.drive-coder.outputs.parameters.pr-number}}`}}"
          - name: BRANCH
            value: "df/issue-{{`{{workflow.parameters.issue-number}}`}}"
          - name: GATE_MODE
            value: {{ .Values.devopsAgent.gate | quote }}
          - name: LABEL
            value: {{ .Values.review.handoffLabel | quote }}
          - name: CHECK_CONTEXT
            value: {{ .Values.devopsAgent.checkContext | quote }}
          - name: WAIT_SECONDS
            value: {{ .Values.devopsAgent.waitSeconds | quote }}
        source: |
          set -eu
          echo "[devops-gate] mode=${GATE_MODE} PR #${PR} — waiting for AWS DevOps Agent..."
          DEADLINE=$(( $(date +%s) + WAIT_SECONDS ))
          CLEARED=false
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if [ "$GATE_MODE" = "label" ]; then
              # Fallback: coder-applied handoff label present on the PR.
              R="$(GH_TOKEN="$GH_TOKEN" REPO="$REPO" PR="$PR" LABEL="$LABEL" node -e '
                const https=require("https");const {GH_TOKEN,REPO,PR,LABEL}=process.env;
                https.get({host:"api.github.com",path:"/repos/"+REPO+"/issues/"+PR+"/labels",headers:{"User-Agent":"df-devops-gate","Authorization":"Bearer "+GH_TOKEN,"Accept":"application/vnd.github+json"}},
                  r=>{let b="";r.on("data",c=>b+=c);r.on("end",()=>{try{const ls=JSON.parse(b).map(x=>x.name);console.log(ls.includes(LABEL)?"cleared":"waiting")}catch(e){console.log("waiting")}})}).on("error",()=>console.log("waiting"));' 2>/dev/null || echo waiting)"
            else
              # Default: the DevOps Agent GitHub App's check-run on the PR head SHA.
              # cleared iff a matching context concluded success/neutral; "blocked"
              # if it concluded failure (BLOCK) — we stop and leave cleared=false.
              R="$(GH_TOKEN="$GH_TOKEN" REPO="$REPO" BRANCH="$BRANCH" CHECK_CONTEXT="$CHECK_CONTEXT" node -e '
                const https=require("https");const {GH_TOKEN,REPO,BRANCH,CHECK_CONTEXT}=process.env;
                const g=(p)=>new Promise((res)=>{https.get({host:"api.github.com",path:p,headers:{"User-Agent":"df-devops-gate","Authorization":"Bearer "+GH_TOKEN,"Accept":"application/vnd.github+json"}},r=>{let b="";r.on("data",c=>b+=c);r.on("end",()=>{try{res(JSON.parse(b))}catch(e){res(null)}})}).on("error",()=>res(null))});
                (async()=>{
                  const pr=await g("/repos/"+REPO+"/pulls?head="+REPO.split("/")[0]+":"+BRANCH+"&state=open");
                  if(!pr||!pr[0]){return console.log("waiting")}
                  const sha=pr[0].head.sha;
                  const re=new RegExp(CHECK_CONTEXT,"i");
                  // check-runs API
                  const cr=await g("/repos/"+REPO+"/commits/"+sha+"/check-runs");
                  const runs=(cr&&cr.check_runs)||[];
                  const m=runs.filter(x=>re.test(x.name));
                  if(m.some(x=>x.status==="completed"&&["success","neutral"].includes(x.conclusion)))return console.log("cleared");
                  if(m.some(x=>x.status==="completed"&&["failure","action_required","cancelled","timed_out"].includes(x.conclusion)))return console.log("blocked");
                  // legacy commit statuses fallback
                  const st=await g("/repos/"+REPO+"/commits/"+sha+"/status");
                  const ss=((st&&st.statuses)||[]).filter(x=>re.test(x.context));
                  if(ss.some(x=>x.state==="success"))return console.log("cleared");
                  if(ss.some(x=>["failure","error"].includes(x.state)))return console.log("blocked");
                  console.log("waiting");
                })();' 2>/dev/null || echo waiting)"
            fi
            case "$R" in
              cleared) CLEARED=true; echo "[devops-gate] AWS DevOps Agent CLEARED"; break ;;
              blocked) CLEARED=false; echo "[devops-gate] AWS DevOps Agent returned BLOCK — Security stays gated"; break ;;
              *) echo "[devops-gate] waiting for AWS DevOps Agent review..."; sleep 20 ;;
            esac
          done
          echo "$CLEARED" > /tmp/cleared
          echo "[devops-gate] cleared=${CLEARED}"
      outputs:
        parameters:
          - name: cleared
            valueFrom:
              path: /tmp/cleared
              default: "false"

    # ---- 2d. security-agent (P3, step 2) — REAL AWS Security Agent, headless ----
    # Runs SECOND, only after DevOps cleared (label present). A trusted hub-side
    # step that clones df/issue-N read-only, stages {source archive, unified diff}
    # in S3, and calls the genuine AWS Security Agent API (create-code-review →
    # start-code-review-job → list-findings) via the workflow's IRSA role — NO
    # GitHub App, NO OAuth. Narrow/strict: OWASP Top 10, secrets, IAM misuse,
    # dependency risk. Posts dark-factory/security + a PR comment. Advisory unless
    # securityAgent.blockLevel is raised and a finding meets it. All logic in
    # scripts/security-agent.sh (ConfigMap file — avoids YAML block-scalar hazards).
    - name: security-agent
      activeDeadlineSeconds: {{ add .Values.securityAgent.pollTimeoutSeconds 300 }}
      volumes:
        - name: review-script
          configMap:
            name: df-review
      script:
        # Runs on the glibc aws-cli v2 image — the ONLY place with the brand-new
        # `securityagent` verbs (Alpine/musl aws-cli 2.32 lacks them; verified
        # in-cluster). security-agent.sh is node-free (python3 + curl + git + aws),
        # so this minimal image needs only git added at start.
        image: {{ .Values.securityAgent.stepImage | default "public.ecr.aws/aws-cli/aws-cli:latest" }}
        command: [bash]
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.github.tokenSecret }}
                key: {{ .Values.github.tokenKey }}
          - name: REPO
            value: "{{`{{workflow.parameters.repo}}`}}"
          - name: BRANCH
            value: "df/issue-{{`{{workflow.parameters.issue-number}}`}}"
          - name: BASE
            value: "{{`{{workflow.parameters.base-branch}}`}}"
          - name: WF_NAME
            value: "{{`{{workflow.name}}`}}"
          # Agent-space + service-role + bucket + region come from the Secret the
          # PreSync bootstrap Job wrote (find-or-create'd the space once).
          - name: AGENT_SPACE_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Values.securityAgent.secretName }}
                key: agentSpaceId
          - name: SERVICE_ROLE_ARN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.securityAgent.secretName }}
                key: serviceRoleArn
          - name: DIFF_BUCKET
            valueFrom:
              secretKeyRef:
                name: {{ .Values.securityAgent.secretName }}
                key: diffBucket
          - name: AWS_REGION
            value: {{ .Values.securityAgent.region | quote }}
          - name: BLOCK_LEVEL
            value: {{ .Values.securityAgent.blockLevel | quote }}
          - name: POLL_TIMEOUT
            value: {{ .Values.securityAgent.pollTimeoutSeconds | quote }}
        volumeMounts:
          - name: review-script
            mountPath: /scripts/security-agent.sh
            subPath: security-agent.sh
        source: |
          set -eu
          # amazon/aws-cli (glibc) has current aws-cli v2 + python3 + curl; add git.
          command -v git >/dev/null 2>&1 || { echo "[security-agent] installing git..."; (dnf install -y -q git >/dev/null 2>&1 || yum install -y -q git >/dev/null 2>&1 || microdnf install -y git >/dev/null 2>&1); }
          command -v zip >/dev/null 2>&1 || { dnf install -y -q zip >/dev/null 2>&1 || yum install -y -q zip >/dev/null 2>&1 || microdnf install -y zip >/dev/null 2>&1 || true; }
          aws securityagent help >/dev/null 2>&1 || { echo "[security-agent] ERROR: aws-cli lacks securityagent (needs v2 >=2.35 glibc)"; exit 1; }
          bash /scripts/security-agent.sh
{{- end }}

{{- if .Values.deployTest.enabled }}
    # ---- 2d. detect-deployable (P4) — does the diff touch deployable artifacts? ----
    # Emits `deployable = true|false`, which gates the expensive deploy-test step.
    # Uses the GitHub compare API (authoritative changed-file list) rather than a
    # local git diff — a depth-1 clone + depth-1 base fetch share no merge-base, so
    # `origin/BASE...HEAD` yields nothing (observed: empty file list → false).
    - name: detect-deployable
      script:
        image: {{ .Values.reviewImage }}
        command: [bash]
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.github.tokenSecret }}
                key: {{ .Values.github.tokenKey }}
          - name: REPO
            value: "{{`{{workflow.parameters.repo}}`}}"
          - name: BRANCH
            value: "df/issue-{{`{{workflow.parameters.issue-number}}`}}"
          - name: BASE
            value: "{{`{{workflow.parameters.base-branch}}`}}"
          - name: K8S_PATTERNS
            value: {{ .Values.deployTest.k8sPatterns | quote }}
          - name: TF_PATTERNS
            value: {{ .Values.deployTest.terraformPatterns | quote }}
        source: |
          set -eu
          FILES="$(GH_TOKEN="$GH_TOKEN" REPO="$REPO" BASE="$BASE" BRANCH="$BRANCH" node -e '
            const https=require("https");
            const {GH_TOKEN,REPO,BASE,BRANCH}=process.env;
            https.get({host:"api.github.com",path:"/repos/"+REPO+"/compare/"+BASE+"..."+BRANCH,headers:{"User-Agent":"df-detect","Authorization":"Bearer "+GH_TOKEN,"Accept":"application/vnd.github+json"}},
              r=>{let b="";r.on("data",c=>b+=c);r.on("end",()=>{try{const j=JSON.parse(b);(j.files||[]).forEach(f=>console.log(f.filename));}catch(e){process.exit(0);}});}).on("error",()=>process.exit(0));
          ')"
          echo "[detect] changed files:"; echo "$FILES" | sed 's/^/  /'
          # Classify: k8s takes precedence over terraform when both are present.
          if echo "$FILES" | grep -qE "$K8S_PATTERNS"; then KIND=k8s
          elif echo "$FILES" | grep -qE "$TF_PATTERNS"; then KIND=terraform
          else KIND=none; fi
          echo "$KIND" > /tmp/kind
          echo "[detect] kind=$KIND"
      outputs:
        parameters:
          - name: kind
            valueFrom:
              path: /tmp/kind
              default: "none"

    # ---- 2e. deploy-test (P4) — content-aware; THE ONLY step with K8s access ----
    # Trusted hub step. Validates the change with the RIGHT tool for its kind:
    #   kind=k8s       → ephemeral namespace apply + wait Ready + teardown (trap).
    #   kind=terraform → terraform init -backend=false + validate (+ fmt check).
    #                    Validation only — NO AWS creds, NO apply (no real infra).
    # Posts the dark-factory/deploy-test commit status AND a marker PR comment with
    # the details. Advisory in v1 (deployTest.blocking=false). The untrusted coder
    # never has K8s access — it only produces the artifacts; this step runs them.
    - name: deploy-test
      inputs:
        parameters:
          - name: kind
      activeDeadlineSeconds: {{ .Values.deployTest.timeoutSeconds }}
      volumes:
        - name: review-script
          configMap:
            name: df-review
      script:
        image: {{ .Values.deployTest.image }}
        command: [bash]
        volumeMounts:
          - name: review-script
            mountPath: /scripts/comment.js
            subPath: comment.js
          - name: review-script
            mountPath: /scripts/deploy-test.sh
            subPath: deploy-test.sh
        env:
          - name: WF_NAME
            value: "{{`{{workflow.name}}`}}"
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.github.tokenSecret }}
                key: {{ .Values.github.tokenKey }}
          - name: REPO
            value: "{{`{{workflow.parameters.repo}}`}}"
          - name: BRANCH
            value: "df/issue-{{`{{workflow.parameters.issue-number}}`}}"
          - name: ISSUE_NUMBER
            value: "{{`{{workflow.parameters.issue-number}}`}}"
          - name: KIND
            value: "{{`{{inputs.parameters.kind}}`}}"
          - name: MANIFEST_PATH
            value: {{ .Values.deployTest.manifestPath | quote }}
          - name: TF_PATH
            value: {{ .Values.deployTest.terraformPath | quote }}
          - name: READY_TIMEOUT
            value: {{ .Values.deployTest.readyTimeoutSeconds | quote }}
          - name: BLOCKING
            value: {{ .Values.deployTest.blocking | quote }}
        source: |
          set -eu
          # All logic lives in review/deploy-test.sh (ConfigMap file) — keeping it out
          # of this YAML block scalar avoids the shell-quoting hazards that broke
          # inline multi-line markdown. Kind-driven so it generalizes to new profiles.
          bash /scripts/deploy-test.sh
{{- end }}

    # ---- 3. Sticky status — rewrite the PR body from the live verdicts ----
    # Runs AFTER every verify step (its DAG deps). The coder wrote the PR body at
    # PR-open time, before verification ran, so its holdout/security/devops lines
    # are placeholders ("pending"). This step reads the authoritative
    # dark-factory/* commit STATUSES from GitHub (the source of truth the verify
    # steps posted) and rewrites the PR body in place with the real verdicts — the
    # "one live sticky status" from the design (README §7). Idempotent: the body
    # between the markers is fully regenerated each run.
    - name: sticky-status
      inputs:
        parameters:
          - name: phase
      volumes:
        - name: review-script
          configMap:
            name: df-review
      script:
        image: {{ .Values.reviewImage }}
        command: [bash]
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.github.tokenSecret }}
                key: {{ .Values.github.tokenKey }}
          - name: REPO
            value: "{{`{{workflow.parameters.repo}}`}}"
          - name: BRANCH
            value: "df/issue-{{`{{workflow.parameters.issue-number}}`}}"
        volumeMounts:
          - name: review-script
            mountPath: /scripts/status.js
            subPath: status.js
        source: |
          set -eu
          echo "[df-run] phase={{`{{inputs.parameters.phase}}`}} — updating PR body from live verdicts (${REPO} ${BRANCH})"
          node /scripts/status.js

    # ---- onExit: release the claim (operator refills the pool) ----
    - name: teardown
      resource:
        action: delete
        flags: ["--ignore-not-found"]
        manifest: |
          apiVersion: extensions.agents.x-k8s.io/v1beta1
          kind: SandboxClaim
          metadata:
            name: df-issue-{{`{{workflow.parameters.issue-id}}`}}
            namespace: {{ .Values.warmPool.namespace }}
