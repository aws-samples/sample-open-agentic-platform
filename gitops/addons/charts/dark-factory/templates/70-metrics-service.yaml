{{- /*
Argo workflow-controller metrics Service (observability). The platform's AWS
Managed Prometheus scraper (peeks-scraper-hub) has a `kubernetes-service-endpoints`
job that discovers any Service annotated `prometheus.io/scrape: "true"` and scrapes
its endpoints. The controller pod exposes :9090/metrics (df_runs_total,
df_run_duration_seconds from the df-run metrics: block, plus Argo's own workflow
metrics) but ships without a metrics Service — so we add an annotated one here.
No scraper edit needed; AMP picks it up automatically. GitOps-managed.
*/ -}}
{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: dark-factory-workflow-metrics
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  clusterIP: None            # headless — we only want endpoint discovery for scraping
  selector:
    app: workflow-controller
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
{{- end }}
