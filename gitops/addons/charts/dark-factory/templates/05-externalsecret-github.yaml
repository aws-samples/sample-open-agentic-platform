{{- /*
GitHub credential — synced from AWS Secrets Manager via ExternalSecret (the same
mechanism the rest of the platform uses, e.g. hub/config, keycloak-clients). This
replaces the manually-created dark-factory-github Secrets so the credential is:
  - GitOps-managed + reproducible on a cluster rebuild (no manual kubectl create),
  - auto-refreshed on rotation (refreshInterval),
  - single source of truth in Secrets Manager (secret id: github.secretsManagerKey).

One ExternalSecret per namespace that needs the token, each mapping the SM secret's
JSON properties to that namespace's expected key names:
  - argo                  → key `token`                  (workflow steps)
  - argo-events           → keys `token` + `webhook-secret` (EventSource HMAC)
  - agent-sandbox-system  → key `gh-token`               (projected into the coder VM)

NOTE (future hardening, docs/dark-factory §credential): move to a GitHub App with
short-lived installation tokens, and a NARROWER token (contents:write only) for the
untrusted coder vs. the trusted orchestrator. This wiring makes that a values change.
*/ -}}
{{- if .Values.github.externalSecret.enabled }}
{{- $store := .Values.github.externalSecret.clusterSecretStore }}
{{- $key := .Values.github.externalSecret.secretsManagerKey }}
{{- $refresh := .Values.github.externalSecret.refreshInterval }}
# ── argo: token ──────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.github.tokenSecret }}
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .Values.github.tokenSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.github.tokenKey }}
      remoteRef:
        key: {{ $key }}
        property: token
---
# ── argo-events: token + webhook-secret ──────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.github.tokenSecret }}
  namespace: {{ .Values.trigger.argoEvents.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .Values.github.tokenSecret }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ $key }}
        property: token
    - secretKey: webhook-secret
      remoteRef:
        key: {{ $key }}
        property: webhook-secret
---
# ── agent-sandbox-system: gh-token (projected into the coder VM) ──────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.github.tokenSecret }}
  namespace: {{ .Values.warmPool.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .Values.github.tokenSecret }}
    creationPolicy: Owner
  data:
    - secretKey: gh-token
      remoteRef:
        key: {{ $key }}
        property: token
{{- if .Values.langfuse.enabled }}
    # Langfuse ingestion keys projected alongside gh-token at /etc/secrets (obs).
    # Kept on THIS ExternalSecret (not a separate Merge ES) because ESO refuses to
    # merge into a secret already Owned by another ExternalSecret.
    - secretKey: langfuse-public-key
      remoteRef:
        key: {{ .Values.langfuse.externalSecret.secretsManagerKey }}
        property: public-key
    - secretKey: langfuse-secret-key
      remoteRef:
        key: {{ .Values.langfuse.externalSecret.secretsManagerKey }}
        property: secret-key
{{- end }}
{{- end }}
