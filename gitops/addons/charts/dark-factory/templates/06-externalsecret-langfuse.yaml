{{- /*
Langfuse ingestion keys (observability) — synced from AWS Secrets Manager. The
coder posts one Langfuse trace per run (LLM token usage + issue/PR metadata), and
reads the keys from projected tmpfs at /etc/secrets/langfuse-{public,secret}-key.
The coder mounts ONE secret (dark-factory-github) at /etc/secrets, so we MERGE the
langfuse keys into that same secret (keys langfuse-public-key / langfuse-secret-key)
by targeting it here — external-secrets merges data across ExternalSecrets that
share a target when creationPolicy=Merge. SM secret dark-factory/langfuse is JSON:
{ public-key, secret-key }.
*/ -}}
{{- if .Values.langfuse.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.langfuse.secretName }}
  namespace: {{ .Values.warmPool.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.langfuse.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.langfuse.externalSecret.clusterSecretStore }}
  target:
    # Merge into the coder's mounted secret so the keys land at /etc/secrets.
    name: {{ .Values.github.tokenSecret }}
    creationPolicy: Merge
  data:
    - secretKey: langfuse-public-key
      remoteRef:
        key: {{ .Values.langfuse.externalSecret.secretsManagerKey }}
        property: public-key
    - secretKey: langfuse-secret-key
      remoteRef:
        key: {{ .Values.langfuse.externalSecret.secretsManagerKey }}
        property: secret-key
{{- end }}
