{{- /*
df-merge-teardown — fired by the Sensor when a HUMAN approves the PR review
(pull_request_review, state=approved) on a df/issue-N PR. This is the ONLY path
that merges: the agent never self-merges (anti-pattern #5) — merge strictly
follows an explicit human approval event.

Steps: verify the PR is green (all dark-factory/* checks succeeded) → merge →
delete the SandboxClaim (frees the warm pool). Guarded so a stray approval on a
non-green PR can't merge. Deterministic name df-merge-<issue-id> for dedup.

Parameters (from the Sensor): issue-number (parsed from the PR branch df/issue-N),
repo, pr-number. The PR-review payload carries no issue id, so this keys on the
issue NUMBER and reaps the claim by label selector.
*/ -}}
{{- if .Values.trigger.argoEvents.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: df-merge-teardown
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
spec:
  serviceAccountName: dark-factory-workflow
  synchronization:
    mutex:
      name: "df-issue-num-{{`{{workflow.parameters.issue-number}}`}}"
  entrypoint: main
  arguments:
    parameters:
      - name: issue-number
      - name: repo
      - name: pr-number
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.argo.workflowTtlSecondsAfterCompletion | default 604800 }}
  templates:
    - name: main
      dag:
        tasks:
          - name: merge
            template: merge-pr
{{- if .Values.microvmSuspend.enabled }}
          # Flow D: this is the FINAL exit — TERMINATE the Lambda MicroVM that was
          # kept suspended across the review→fix loop. Runs before the claim delete so
          # the VM is destroyed explicitly (the suspended VM would otherwise be kept by
          # the bridge's suspend-marker on pod delete → leak). No-op for Kata.
          - name: microvm-terminate
            template: microvm-terminate
            dependencies: [merge]
{{- end }}
          - name: teardown
            template: teardown-claim
{{- if .Values.microvmSuspend.enabled }}
            dependencies: [microvm-terminate]
{{- else }}
            dependencies: [merge]
{{- end }}

    # ---- Merge the PR — only if every dark-factory/* check is green ----
    - name: merge-pr
      volumes:
        - name: review-script
          configMap:
            name: df-review
      script:
        image: {{ .Values.reviewImage }}
        command: [bash]
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.github.tokenSecret }}
                key: {{ .Values.github.tokenKey }}
          - name: REPO
            value: "{{`{{workflow.parameters.repo}}`}}"
          - name: PR
            value: "{{`{{workflow.parameters.pr-number}}`}}"
{{- if .Values.devopsAgent.enabled }}
          # Require the REAL AWS DevOps Agent check-run (Checks API) green before
          # merge — merge.js reads both commit statuses and check-runs.
          - name: DEVOPS_CHECK
            value: {{ .Values.devopsAgent.checkRunName | quote }}
          - name: REQUIRE_DEVOPS
            value: "true"
{{- else }}
          - name: REQUIRE_DEVOPS
            value: "false"
{{- end }}
{{- if and .Values.securityAgent.app .Values.securityAgent.app.enabled }}
          # Require the REAL AWS Security Agent GitHub App check green before merge
          # so a Security BLOCK can't be merged past (in addition to the advisory
          # dark-factory/security from the headless path — both run).
          - name: SECURITY_CHECK
            value: {{ .Values.securityAgent.app.checkRunName | quote }}
          - name: REQUIRE_SECURITY
            value: "true"
{{- end }}
        volumeMounts:
          - name: review-script
            mountPath: /scripts/merge.js
            subPath: merge.js
        source: |
          set -eu
          echo "[df-merge] human-approved PR #${PR} in ${REPO} — verifying + merging"
          node /scripts/merge.js

{{- if .Values.microvmSuspend.enabled }}
    # ---- Flow D: terminate the Lambda MicroVM (final exit) ----
    # Resolve the per-session microvm id from the owning Sandbox annotation (the bridge
    # wrote it after RunMicrovm), then TerminateMicrovm. A suspended VM can be
    # terminated directly. Advisory (never fails the merge) — the reaper + idlePolicy
    # are backstops. Needs lambda-microvms:TerminateMicrovm on the workflow's IRSA role.
    - name: microvm-terminate
      script:
        image: {{ .Values.microvmSuspend.image | default "alpine/k8s:1.31.0" }}
        command: [sh]
        source: |
          set -eu
          NS="{{ .Values.warmPool.namespace }}"
          REGION="{{ .Values.securityAgent.region | default "us-west-2" }}"
          NUM="{{`{{workflow.parameters.issue-number}}`}}"
          # Find the Sandbox for this issue (by the number label the claim/sandbox carry).
          SB=$(kubectl get sandbox -n "$NS" -l "dark-factory.io/issue-number=${NUM}" \
                -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          [ -z "$SB" ] && { echo "[microvm-terminate] no Sandbox for issue #${NUM} — nothing to terminate"; exit 0; }
          VMID=$(kubectl get sandbox "$SB" -n "$NS" -o jsonpath='{.metadata.annotations.microvm-lifecycle\.agents\.x-k8s\.io/microvm-id}' 2>/dev/null || echo "")
          [ -z "$VMID" ] && { echo "[microvm-terminate] Sandbox/$SB has no microvm-id — nothing to terminate"; exit 0; }
          echo "[microvm-terminate] TerminateMicrovm ${VMID} (issue #${NUM}, final exit)"
          command -v aws >/dev/null 2>&1 || { echo "[microvm-terminate] aws cli missing on image — skipping (advisory)"; exit 0; }
          aws lambda-microvms terminate-microvm --region "$REGION" --microvm-identifier "$VMID" 2>&1 || echo "[microvm-terminate] terminate failed (advisory)"
{{- end }}

    # ---- Teardown the claim (operator refills the pool) ----
    # Delete by the issue-number label (the PR-review event has no issue id). For Lambda
    # this also removes the (idle) bridge pod; the VM is already terminated above.
    - name: teardown-claim
      resource:
        action: delete
        flags:
          - "--ignore-not-found"
          - "--selector=dark-factory.io/issue-number={{`{{workflow.parameters.issue-number}}`}}"
        manifest: |
          apiVersion: extensions.agents.x-k8s.io/v1beta1
          kind: SandboxClaim
          metadata:
            namespace: {{ .Values.warmPool.namespace }}
{{- end }}
