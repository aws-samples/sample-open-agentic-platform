{{/*
  Supplies Bifrost's encryption key and the platform virtual key from AWS
  Secrets Manager via External Secrets (same ClusterSecretStore the rest of the
  platform uses). Produces the Kubernetes Secret referenced by the upstream
  chart's `bifrost.encryptionKeySecret` and injected into the pod via `envFrom`.

  Expected Secrets Manager entry (JSON), keyed by `externalSecret.secretManagerKey`
  (defaults to "<cluster>/bifrost"):
    {
      "BIFROST_ENCRYPTION_KEY": "<32-byte key>",
      "BIFROST_PLATFORM_VK":    "<virtual key string the agents present>"
    }

  Keys are intentionally env-var-friendly (no hyphens) so they can be consumed
  both as `encryptionKeySecret.key` and via `envFrom`.
*/}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.targetSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStoreName }}
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  target:
    name: {{ .Values.externalSecret.targetSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: BIFROST_ENCRYPTION_KEY
      remoteRef:
        key: {{ .Values.externalSecret.secretManagerKey | quote }}
        property: BIFROST_ENCRYPTION_KEY
    - secretKey: BIFROST_PLATFORM_VK
      remoteRef:
        key: {{ .Values.externalSecret.secretManagerKey | quote }}
        property: BIFROST_PLATFORM_VK
{{- end }}
