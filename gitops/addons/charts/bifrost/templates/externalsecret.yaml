{{/*
  Pulls the Bifrost encryption key and platform virtual key from the
  account-level AWS Secrets Manager secret created by `task agentic:bifrost-secrets`.
  This ExternalSecret is rendered on every cluster (hub + all spokes) so Bifrost
  has its secrets regardless of which cluster it's running on.

  Secrets Manager path:  open-agentic-platform/bifrost
  Properties:            BIFROST_ENCRYPTION_KEY, BIFROST_PLATFORM_VK

  The resulting Kubernetes Secret (bifrost-secrets) is consumed by:
  - bifrost.encryptionKeySecret  (encryption at rest for the governance store)
  - bifrost.envFrom              (injects BIFROST_PLATFORM_VK for the VK seed)
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStoreName }}
  refreshInterval: "5m"
  target:
    name: bifrost-secrets
    creationPolicy: Owner
  data:
    - secretKey: BIFROST_ENCRYPTION_KEY
      remoteRef:
        key: {{ .Values.externalSecret.secretManagerKey | quote }}
        property: BIFROST_ENCRYPTION_KEY
    - secretKey: BIFROST_PLATFORM_VK
      remoteRef:
        key: {{ .Values.externalSecret.secretManagerKey | quote }}
        property: BIFROST_PLATFORM_VK
