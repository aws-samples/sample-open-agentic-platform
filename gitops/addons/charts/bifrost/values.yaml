podIdentity:
  enabled: true
  clusterName: ""
  region: ""
  namespace: bifrost
  serviceAccountName: bifrost

bifrost:
  image:
    tag: "v1.5.0"
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: bifrost
  # OTEL plugin — exports LLM call spans to the local OTel Collector.
  # Bifrost reads inbound W3C traceparent headers and creates child spans,
  # producing a unified trace tree with agent + Bifrost spans correlated.
  plugins:
    otel:
      enabled: true
      version: 1
      config:
        service_name: "bifrost"
        collector_url: "otel-collector.otel.svc.cluster.local:4317"
        trace_type: "genai_extension"
        protocol: "grpc"
        insecure: true
