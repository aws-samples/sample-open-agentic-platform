syncPolicy:
  automated:
    selfHeal: true
    allowEmpty: true
    prune: true
  retry:
    limit: -1
    backoff:
      duration: 5s
      factor: 2
      maxDuration: 10m
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
syncPolicyAppSet:
  preserveResourcesOnDeletion: false
useSelectors: true
repoURLGit: '{{default "https://github.com/aws-samples/sample-open-agentic-platform.git" .metadata.annotations.addons_repo_url}}'
repoURLGitRevision: '{{default "main" .metadata.annotations.addons_repo_revision}}'
repoURLGitBasePath: '{{default "gitops/addons/" .metadata.annotations.addons_repo_basepath}}'

valueFiles:
  - default/addons
  - environments/{{.metadata.labels.environment}}/addons
  - clusters/{{.nameNormalized}}/addons
useValuesFilePrefix: true
valuesFilePrefix: 'tenants/{{.metadata.labels.tenant}}/'

########################################
# Observability — LLM Gateway
########################################

litellm:
  enabled: false
  namespace: litellm
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/litellm'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '3'
  selector:
    matchExpressions:
      - key: enable_litellm
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'

########################################
# Observability — Tracing & Metrics
########################################

langfuse:
  enabled: true
  namespace: langfuse
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/langfuse'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selectorMatchLabels:
    enable_langfuse: "true"
  selector:
    matchExpressions:
      - key: enable_langfuse
        operator: In
        values: ['true']
  # Langfuse is a hub singleton (one Keycloak client, hub-domain redirect, shared
  # platform realm). It must run ONLY on the control-plane/hub. alwaysSelector is
  # honored regardless of the global useSelectors flag, so the generated
  # ApplicationSet matches only clusters whose `environment` label is control-plane
  # (the hub) — spoke langfuse apps are pruned. Spoke agents send traces to the hub
  # Langfuse via the OTel pipeline.
  alwaysSelector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
    clusterName: '{{.metadata.annotations.aws_cluster_name}}'
    ingress:
      enabled: true
      host: '{{.metadata.annotations.ingress_domain_name}}'
    keycloak:
      issuerUrl: '{{default (printf "https://%s/keycloak/realms/platform" .metadata.annotations.ingress_domain_name) (index .metadata.annotations "keycloak_issuer_url")}}'
      secretManagerKey: '{{.metadata.annotations.aws_cluster_name}}/keycloak-clients'
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/dataFrom

jaeger:
  enabled: false
  namespace: jaeger
  chartName: jaeger
  defaultVersion: '3.4.1'
  chartRepository: 'https://jaegertracing.github.io/helm-charts'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_jaeger
        operator: In
        values: ['true']
  valuesObject:
    provisionDataStore:
      cassandra: false
    allInOne:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    storage:
      type: memory
    agent:
      enabled: false
    collector:
      enabled: false
    query:
      enabled: false

otel-collector:
  enabled: true
  namespace: otel
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/otel-collector'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '6'
  selector:
    matchExpressions:
      - key: enable_otel_collector
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
    langfuse:
      enabled: true
      endpoint: 'https://{{.metadata.annotations.ingress_domain_name}}/api/public/otel'
      secretManagerKey: 'hub/langfuse-otel'
    bifrost:
      enabled: true
      scrapeEndpoint: 'bifrost.bifrost.svc.cluster.local:8080'
    amp:
      enabled: true
      remoteWriteEndpoint: '{{with (index .metadata.annotations "amp_endpoint_url")}}{{.}}{{end}}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'

prometheus-operator-crds:
  enabled: true
  namespace: monitoring
  chartName: prometheus-operator-crds
  defaultVersion: '28.0.1'
  chartRepository: 'https://prometheus-community.github.io/helm-charts'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_monitoring
        operator: In
        values: ['true']
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations

########################################
# AgentCore — Crossplane Compositions
########################################

crossplane-agentcore:
  enabled: true
  namespace: crossplane-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/crossplane-agentcore'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '4'
  selector:
    matchExpressions:
      - key: enable_agent_core
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      eksClusterName: '{{.metadata.annotations.aws_cluster_name}}'
      projectName: '{{default "agent-core" (index .metadata.annotations "agent_core_project_name")}}'
      networkMode: '{{default "PUBLIC" (index .metadata.annotations "agent_core_network_mode")}}'
  ignoreDifferences:
    - group: apiextensions.crossplane.io
      kind: Composition
      jsonPointers:
        - /spec/mode
        - /spec/publishConnectionDetailsWithStoreConfigRef
      jqPathExpressions:
        - .spec.resources[].readinessChecks
        - .spec.resources[].patches[].type
    - group: apiextensions.crossplane.io
      kind: CompositeResourceDefinition
      jsonPointers:
        - /metadata/annotations

########################################
# Bifrost — AI Gateway
########################################

bifrost:
  enabled: true
  namespace: bifrost
  defaultVersion: '0.1.0'
  # Local umbrella chart: wraps upstream maximhq/bifrost and adds the Crossplane
  # Pod Identity (Bedrock access) + ExternalSecret in the same Application.
  path: 'gitops/addons/charts/bifrost'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_bifrost
        operator: In
        values: ['true']
  valuesObject:
    podIdentity:
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
      region: '{{.metadata.annotations.aws_region}}'
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates

########################################
# AgentGateway — MCP Auth Gateway
########################################

gateway-api-crds:
  enabled: true
  namespace: agentgateway-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/gateway-api-crds'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '7'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    gatewayApiVersion: "1.5.0"

agentgateway-crds:
  enabled: true
  namespace: agentgateway-system
  chartName: agentgateway-crds
  defaultVersion: 'v1.1.0'
  chartRepository: 'cr.agentgateway.dev'
  chartNamespace: charts
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '7'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations

agentgateway:
  enabled: true
  namespace: agentgateway-system
  chartName: agentgateway
  defaultVersion: 'v1.1.0'
  chartRepository: 'cr.agentgateway.dev'
  chartNamespace: charts
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '8'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    controller:
      extraEnv:
        KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"

agent-gateway:
  enabled: true
  namespace: agent-core-infra
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/agent-gateway'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '9'
  selector:
    matchExpressions:
      - key: enable_agent_gateway
        operator: In
        values: ['true']
  valuesObject:
    global:
      keycloak:
        issuerUrl: '{{default (printf "https://%s/keycloak/realms/platform" (index .metadata.annotations "ingress_domain_name")) (index .metadata.annotations "keycloak_issuer_url")}}'
        serviceName: '{{default "keycloak" (index .metadata.annotations "keycloak_service_name")}}'
        namespace: '{{default "keycloak" (index .metadata.annotations "keycloak_namespace")}}'
    ingress:
      enabled: true
      host: '{{index .metadata.annotations "ingress_domain_name"}}'
      # Agents get a dedicated hostname that is a SIBLING of the main ingress host
      # (same parent domain), so a single wildcard ACM cert covers both. For host
      # "idp.elamaras.people.aws.dev" the agents host is "agents.elamaras.people.aws.dev"
      # — both matched by "*.elamaras.people.aws.dev". (The old "agents.<full-host>"
      # default produced "agents.idp.elamaras..." which a single-level wildcard does
      # NOT cover, so the ALB never provisioned: "no certificate found for host".)
      # If the domain has no parent (bare apex), fall back to "agents.<host>".
      # The agent_gateway_host annotation, when set, overrides this entirely.
      agentHost: '{{ $d := index .metadata.annotations "ingress_domain_name" }}{{ $parent := splitList "." $d | rest | join "." }}{{ $auto := ternary (printf "agents.%s" $parent) (printf "agents.%s" $d) (gt (len (splitList "." $d)) 2) }}{{ default $auto (index .metadata.annotations "agent_gateway_host") }}'
    mcpAuth:
      resourceMetadata:
        resource: '{{default "http://agentgateway-proxy.agentgateway-system.svc.cluster.local:8080/sse" (index .metadata.annotations "agent_gateway_resource_url")}}'
    # Secretless workload identity (Shape A): trust the cluster's own EKS OIDC
    # issuer as a second JWT provider so agent ServiceAccount tokens authenticate
    # without a secret. Sourced from the eks_oidc_provider cluster-secret
    # annotation (set automatically by the platform cluster composition for
    # spokes; set manually on the hub — see gitops/DEPLOYMENT.md). When the
    # annotation is absent the value is empty and the workload provider is
    # omitted (humans-only via Keycloak).
    workloadIdentity:
      issuer: '{{ index .metadata.annotations "eks_oidc_provider" }}'
      jwksHost: '{{ with (index .metadata.annotations "eks_oidc_provider") }}oidc.eks.{{ index $.metadata.annotations "aws_region" }}.amazonaws.com{{ end }}'
      jwksPath: '{{ with (index .metadata.annotations "eks_oidc_provider") }}{{ printf "%s/keys" (trimPrefix (printf "https://oidc.eks.%s.amazonaws.com" (index $.metadata.annotations "aws_region")) .) }}{{ end }}'

# OAM Agent Components — KubeVela ComponentDefinitions for agentic workloads
# (agent, mcp-server, agentcore-memory). Requires KubeVela to be running
# (provisioned by the platform via appmod-blueprints' kubevela addon at
# sync-wave 3). Sync-wave 5 here ensures KubeVela CRDs and webhooks are
# established before these CRs are applied.
oam-agent-components:
  enabled: true
  namespace: vela-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/oam-agent-components'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'  # after kubevela (wave 3 on platform side)
  selector:
    matchExpressions:
      - key: enable_oam_components
        operator: In
        values: ['true']
  valuesObject:
    global:
      awsRegion: '{{.metadata.annotations.aws_region}}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'

# Agent Sandbox OPERATOR (upstream agent-sandbox v0.5.1) — the controller +
# Sandbox/SandboxClaim/SandboxTemplate/SandboxWarmPool CRDs + webhooks. Vendored
# manifest applied directly (it's a self-contained install; the ~400KB CRD set
# is too large for a Helm-templated chart). ServerSideApply + Replace handle the
# oversized CRDs. Sync-wave 0: CRDs + operator MUST exist before the kata-deploy
# runtime (wave 1) and the agent-sandbox chart CRs (wave 2).
agent-sandbox-operator:
  enabled: true
  namespace: agent-sandbox-system
  defaultVersion: '0.5.1'
  path: 'gitops/addons/charts/agent-sandbox/upstream'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '0'
  syncPolicyAppSet:
    preserveResourcesOnDeletion: false
  # Agent Sandbox is a HUB-only capability. The Dark Factory (Flow B) is a
  # pre-dev build/author activity that writes code + holds GitHub write access —
  # it belongs on the hub (build plane, co-located with Argo Workflows), not on
  # a spoke (deploy/run plane hosting enterprise workloads). alwaysSelector is
  # honored regardless of the global useSelectors flag, so the generated
  # ApplicationSet matches ONLY the cluster whose `environment` label is
  # `control-plane` (the hub) — spoke apps are pruned. Kata runs on a dedicated
  # tainted nested-virt MNG (Auto Mode can't host it) — see docs/dark-factory §10.
  alwaysSelector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

# Agent Sandbox capability chart — RuntimeClasses, kata-readiness (removes the
# runtime-not-ready startup taint), coder SandboxTemplate, SandboxWarmPool, and
# the egress NetworkPolicy. Sync-wave 2: after the operator (wave 0) + kata
# runtime (wave 1). Consumers (the Dark Factory, Flow B) then claim from the
# warm pool via a SandboxClaim(warmPoolRef).
agent-sandbox:
  enabled: true
  namespace: agent-sandbox-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/agent-sandbox'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '2'
  # Hub-only (see agent-sandbox-operator note above). alwaysSelector pins
  # generation to the `environment: control-plane` cluster regardless of useSelectors.
  alwaysSelector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']
  valuesObject:
    coderTemplate:
      bifrostUrl: '{{default "http://bifrost.bifrost.svc.cluster.local:8080" (index .metadata.annotations "bifrost_url")}}'

# agent-sandbox-lambda — Flow D. A SECOND, opt-in Agent-Sandbox substrate: the coder
# runs in an AWS Lambda MicroVM (Firecracker) instead of a Kata pod. KRO builds the
# platform image ONCE (MicrovmImage + build/exec IAM + S3 + logs via ACK GA
# controllers); a shim (bridge pod + lifecycle controller) drives the per-session VM
# (RunMicrovm/suspend/resume/TerminateMicrovm) imperatively. Same namespace + operator
# as agent-sandbox; only ADDS the MicroVM path. DORMANT until the per-cluster overlay
# flips microvm.enabled=true (needs Managed KRO+ACK, the self-managed ack-lambdamicrovms
# controller, and a published arm64 coder artifact). Hub-only, sync-wave 2.
agent-sandbox-lambda:
  enabled: true
  namespace: agent-sandbox-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/agent-sandbox-lambda'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '2'
  alwaysSelector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']

# kata-deploy — installs the Kata runtime (containerd handlers for kata-clh /
# kata-qemu) on the tainted kata MNG nodes. Separate app (not a subchart dep of
# agent-sandbox) so ArgoCD pulls the upstream OCI chart directly. Gated by
# enable_agent_sandbox_kata — only clusters with a kata-capable nested-virt MNG
# (see docs/dark-factory §12a) should carry that label. Sync-wave 1: runtime is
# installed on nodes before the Sandbox operator (wave 2) schedules VMs.
kata-deploy:
  enabled: true
  namespace: kube-system
  chartName: kata-deploy
  defaultVersion: '3.32.0'
  # OCI chart at oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy.
  # Do NOT set chartNamespace — the appset would build chart=<ns>/<name>
  # (kata-containers/kata-deploy) producing a wrong OCI path. The namespace is
  # already part of chartRepository.
  chartRepository: 'ghcr.io/kata-containers/kata-deploy-charts'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '1'
  # Hub-only: the kata runtime is only installed where the nested-virt MNG
  # exists (the hub). alwaysSelector pins generation to `environment:
  # control-plane` regardless of useSelectors — no spoke kata-deploy app.
  alwaysSelector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']
  # The kata-deploy OCI chart reads these keys at the ROOT of values (verified
  # against chart v3.32.0 templates/kata-deploy.yaml → .Values.nodeSelector /
  # .Values.tolerations). Do NOT nest them under a `kata-deploy:` key.
  valuesObject:
    image:
      reference: quay.io/kata-containers/kata-deploy
      tag: '3.32.0'
    # Run the DaemonSet ONLY on the tainted nested-virt kata node — never on the
    # hub's Auto Mode control-plane nodes (where it crashes on the TEE/nydus
    # snapshotter and would churn containerd).
    nodeSelector:
      kata-enabled: 'true'
    tolerations:
      - key: kata
        operator: Equal
        value: 'true'
        effect: NoSchedule
      - key: katacontainers.io/runtime-not-ready
        operator: Exists
        effect: NoSchedule
    # Only install the two VMMs the platform uses (clh default + qemu); the
    # RuntimeClasses are rendered by the agent-sandbox chart, not kata-deploy.
    shims:
      disableAll: true
      qemu:
        enabled: true
      clh:
        enabled: true
    runtimeClasses:
      enabled: false

# ack-lambdamicrovms (Flow D) — SELF-MANAGED ACK controller for the pre-GA
# Lambda MicroVM service (lambdamicrovms.services.k8s.aws: MicrovmImage + Microvm).
# Self-managed because Managed ACK (EKS Capability) only bundles GA-upstream
# controllers, and lambdamicrovms is still v1alpha1. Managed ACK (GA iam/s3) and
# this self-managed controller COEXIST (different CRD groups). When lambdamicrovms
# goes GA, delete this addon and Managed ACK adopts it — the KRO RGD is unchanged.
#
# DISABLED by default: Flow D is dormant until a cluster opts in. Hub-only, like
# the rest of the sandbox substrate. Installs the OCI chart
# oci://public.ecr.aws/aws-controllers-k8s/lambdamicrovms-chart. Sync-wave 0 so the
# CRDs + controller are up before the agent-sandbox chart's MicrovmSandbox RGD
# (wave 2) references them.
ack-lambdamicrovms:
  enabled: false
  namespace: ack-system
  chartName: lambdamicrovms-chart
  defaultVersion: '0.1.1'
  chartRepository: 'public.ecr.aws/aws-controllers-k8s'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '0'
  # Hub-only: the MicroVM substrate lives with the rest of the sandbox capability
  # on the build plane. alwaysSelector pins generation to environment:
  # control-plane regardless of useSelectors — never generated on a spoke.
  alwaysSelector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']
  # ACK chart reads these at the ROOT of values (chart v0.1.1). The controller
  # reconciles the Microvm + MicrovmImage CRDs; it uses EKS Pod Identity for AWS
  # auth (empty SA annotations — the pod-identity association is created out of
  # band / by the platform), so no IRSA role-arn annotation is set here.
  valuesObject:
    aws:
      region: '{{default "us-west-2" (index .metadata.annotations "aws_region")}}'
    serviceAccount:
      create: true
      name: ack-lambdamicrovms-controller
    # Cluster-scoped install so the single MicrovmSandbox RGD (any namespace) can
    # create Microvm/MicrovmImage CRs the controller reconciles.
    installScope: cluster
    deletionPolicy: delete

# Dark Factory (Flow B) — Argo Workflows that turn a GitHub issue into a PR by
# claiming the Flow A warm pool. Hub-only (co-located with Argo Workflows + the
# sandbox pool); sync-wave 3 so it lands after the agent-sandbox capability
# (wave 2). Deploys the WorkflowTemplates + workflow RBAC.
dark-factory:
  enabled: true
  namespace: agent-sandbox-system
  defaultVersion: '0.1.0'
  path: 'gitops/addons/charts/dark-factory'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '3'
  # Hub-only. alwaysSelector pins generation to environment: control-plane
  # regardless of useSelectors — never generated on a spoke.
  alwaysSelector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']
