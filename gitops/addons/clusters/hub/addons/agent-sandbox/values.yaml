# Hub (openclaw-eks / control-plane) overlay for the agent-sandbox capability.
#
# The chart default (charts/agent-sandbox/values.yaml) keeps the `nodepool`
# block cluster-agnostic. This overlay supplies the hub cluster's specific
# coordinates for the Kata nested-virt Managed Node Group and (optionally) flips
# it on. `nodepool.enabled` stays false until we explicitly activate/adopt it.
#
# clusterEndpoint + clusterCA are NOT secrets: the CA is the cluster's PUBLIC
# api-server certificate (no private key) and the endpoint is public DNS — both
# ship in every kubeconfig. They live here (per-cluster overlay) rather than the
# chart default purely for reusability; they get baked into the LaunchTemplate
# userData (nodeadm NodeConfig) at Helm render time, so a k8s Secret/env cannot
# feed them. A future refactor (drop the custom amiId → let EKS auto-inject the
# bootstrap) would remove them from git entirely.
nodepool:
  # Flip to true (and manageAddons as needed) to provision/adopt the kata MNG.
  enabled: false
  # Adopt the existing vpc-cni + kube-proxy addons on this cluster.
  manageAddons: false
  region: us-west-2
  providerConfigName: default
  # Live hub cluster control-plane coordinates (public, non-secret).
  clusterName: hub
  clusterEndpoint: https://5E188804F70B5BD204A38FCAA233AF3D.gr7.us-west-2.eks.amazonaws.com
  serviceCidr: 172.20.0.0/16
  clusterCA: ""
  # Node group shape (hub).
  nodegroupName: kata-sandbox
  nodeRoleArn: arn:aws:iam::940019131157:role/hub-kata-node-role
  subnetIds:
    - subnet-0694e405e202f825e
    - subnet-0f161be05a87d5335
  instanceType: c8i.4xlarge          # 8i family → exposes VT-x for nested virt
  amiId: ami-055ebeb74702bc758        # EKS-optimized AL2023 for k8s 1.35 (x86_64)
  minSize: 0
  desiredSize: 1
  maxSize: 3
  # Adopt the existing LaunchTemplate in place (external-name).
  launchTemplateId: lt-0e204ea3e305e2e1f
  launchTemplateVersion: "$Latest"
