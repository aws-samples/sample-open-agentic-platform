# Hub (openclaw-eks / control-plane) overlay for the agent-sandbox-lambda chart
# (Flow D — Lambda MicroVM substrate).
#
# DORMANT (microvm.enabled=false) until the self-managed ack-lambdamicrovms
# controller is synced (gitops/addons/bootstrap/default/addons.yaml) and the arm64
# coder artifact is published to S3. Managed KRO + Managed ACK capabilities are
# ACTIVE on the hub. The ARNs below are public identifiers (not secrets).
microvm:
  enabled: true
  region: us-west-2
  # MUST be kro.run — EKS Managed KRO only watches the kro.run group (see chart values.yaml).
  apiGroup: kro.run
  # aws-cli v2 (has the pre-GA lambda-microvms service; alpine/k8s's aws-cli 1.34 does NOT,
  # so RunMicrovm never fired). bridge.sh/reconcile.sh fetch kubectl at start. See chart values.
  bridgeImage: public.ecr.aws/aws-cli/aws-cli:latest
  # Hub account (for the ACK PodIdentityAssociation role ARN).
  accountId: "940019131157"
  podIdentity:
    clusterName: hub
    controllerNamespace: ack-system
    controllerServiceAccount: ack-lambdamicrovms-controller
  # AWS-published base MicroVM image (ARM_64 — the only arch Lambda MicroVM supports).
  baseImageARN: "arn:aws:lambda:us-west-2:aws:microvm-image:al2023-1"
  # Lambda MicroVM codeArtifact.uri is S3-ONLY (a zip with the coder app + a Dockerfile);
  # it is NOT an ECR image reference. The Dockerfile inside MAY pull the arm64
  # dark-factory-coder from ECR as a base layer (the build role keeps ecr:Get*).
  # MUST live in the bucket the RGD creates: ${image.name}-microvm-artifacts (here
  # `coder-microvm-artifacts`). Previously pointed at a hand-named bucket that the RGD
  # never provisioned, so the image build hit NoSuchBucket/CREATE_FAILED. Publish the
  # artifact zip to this exact bucket/key.
  codeArtifactUri: "s3://coder-microvm-artifacts/coder-v0.2.5-arm64-r2.zip"
  image:
    enabled: true
    name: coder
  defaults:
    maxIdleDurationSeconds: 900
    suspendedDurationSeconds: 300
  lifecycle:
    intervalSeconds: 15
  warmPool:
    name: coder-warmpool-microvm
    targetIdle: 1
