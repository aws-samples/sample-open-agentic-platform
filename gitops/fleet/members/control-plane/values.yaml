clusterName: control-plane
labels:
  environment: control-plane
  tenant: default
  client_provisioner: keycloak
# Keycloak clients provisioned for this environment by the platform's
# keycloak-client-provisioner (appmod-blueprints). Declared here in OAP so the
# platform repo stays agentgateway-agnostic.
#
# Realm: defaults to "platform" (shared across envs for now).
# TODO(env-isolation): a dev/prod/hub client in the SAME realm is NOT isolated —
# any platform-realm token passes every gateway. Real isolation requires
# per-environment realms (oidc.realm per member) or separate IdP instances.
# Tracked for a later iteration.
clients:
  - name: agentgateway          # → clientId "agentgateway-control-plane"
    type: confidential
    flows:
      - client_credentials      # serviceAccountsEnabled — agents get a token via client_credentials
