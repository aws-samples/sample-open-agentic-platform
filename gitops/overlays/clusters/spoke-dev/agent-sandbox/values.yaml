# spoke-dev overlay for the agent-sandbox capability.
#
# Supplies the coder image the chart deliberately leaves EMPTY. Image URIs are
# account-specific, so shipping a concrete ECR URI as a public chart default would
# leak an account ID to everyone who installs the chart (PR #32 review item 1). The
# SandboxTemplate wraps this in Helm `required`, so a cluster without this overlay
# fails at render with a named error rather than silently emitting `image:` empty
# and failing later at pod creation.
#
# DORMANT: agent_sandbox is false in overlays/environments/dev/enabled-addons.yaml,
# so this overlay is not rendered into any Application today. The warm pool moved to
# the hub (df-run's SandboxClaim has no cross-cluster mechanism). Kept so re-enabling
# dev does not fail at render on the `required` guard.
#
# Repointed 2026-07-31 to the in-account image built from examples/dark-factory/coder
# — the old v0.1.11 URI pointed at foreign account 940019131157 and was never
# pullable here. spoke-dev is in the SAME account (259732043995), so the registry is
# reachable; its node role's ECR pull permission is UNVERIFIED (the pool is dormant,
# nothing has exercised it). Check that before relying on a dev warm pool.
coderTemplate:
  image: 259732043995.dkr.ecr.us-west-2.amazonaws.com/dark-factory-coder:v0.1.12
