# Hub (control-plane) overlay for the agent-sandbox capability.
#
# WHY THIS FILE IS REQUIRED
# coderTemplate.image is intentionally EMPTY in the chart defaults (image URIs are
# account-specific and must not ship in a public chart), and the SandboxTemplate
# wraps it in Helm `required`. Without this file, agent-sandbox-hub fails to render
# with "coderTemplate.image is required" rather than silently emitting an empty
# image. Mirrors gitops/overlays/clusters/spoke-dev/agent-sandbox/values.yaml.
#
# The sandbox now runs HERE rather than on the spoke: df-run's claim step creates a
# SandboxClaim with no cross-cluster mechanism, so the warm pool must sit on the
# same cluster as the Dark Factory orchestrator (argo + argo-events).
#
# Built from examples/dark-factory/coder into THIS account's ECR (259732043995) on
# 2026-07-31, replacing a v0.1.11 URI that pointed at foreign account 940019131157
# and was therefore never pullable here. Contents verified in the built image:
# node 20.20.2, git 2.52.0, bash 5.3.3, python 3.12.13, go 1.25.10, Claude Code
# CLI 2.1.197, /app/entrypoint.js (syntax-checked), USER 1000, linux/amd64 —
# matching the kata node (c8i.2xlarge, amd64) and the SandboxTemplate's
# runAsUser: 1000.
#
# The kata nodes can pull it: KarpenterNodeRole-hub carries
# AmazonEC2ContainerRegistryPullOnly, and the repo is in-account (no cross-account
# repository policy needed).
#
# To rebuild:
#   cd examples/dark-factory/coder
#   aws ecr get-login-password --region us-west-2 \
#     | docker login --username AWS --password-stdin 259732043995.dkr.ecr.us-west-2.amazonaws.com
#   docker build --platform linux/amd64 -t 259732043995.dkr.ecr.us-west-2.amazonaws.com/dark-factory-coder:<next> .
#   docker push 259732043995.dkr.ecr.us-west-2.amazonaws.com/dark-factory-coder:<next>
# The ECR repo has IMMUTABLE tags, so bump the tag — pushing over v0.1.12 is refused.
coderTemplate:
  image: 259732043995.dkr.ecr.us-west-2.amazonaws.com/dark-factory-coder:v0.1.12
