# Enabled addons for the prod environment (spoke clusters).
enabledAddons:
  # Core
  metrics_server: true
  ingress_class_alb: true
  aws_load_balancer_controller: true
  default_storage_class: true
  external_secrets: true
  external_dns: true
  cert_manager: true
  # Security
  kyverno: true
  kyverno_policies: true
  # Observability
  kube_state_metrics: true
  prometheus_node_exporter: true
  aws_for_fluentbit: true
  # Platform
  crossplane: true
  crossplane_aws: true
  kubevela: true
  argo_rollouts: true
  # Agentic Platform
  agent_platform: true
  bifrost: true
  # Agent Sandbox capability installed on prod too (permanent platform feature),
  # but the Dark Factory pipeline never runs here — the prod warm pool stays
  # dormant. Unreviewed, agent-authored code is only ever built/tested on
  # spoke-dev (production-safety).
  agent_sandbox: true
