# Dark Factory orchestrator — Deployment + Service.
#
# Runs on spoke-dev only (Flow B), on the general-purpose Auto Mode nodes (NOT
# the kata MNG — the orchestrator is trusted and holds no untrusted code, so it
# does not need micro-VM isolation). It reaches the coder sandbox over the
# pod network and the Kubernetes API via its ServiceAccount.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dark-factory-orchestrator
  namespace: agent-sandbox-system
  labels:
    app: dark-factory-orchestrator
    app.kubernetes.io/part-of: dark-factory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dark-factory-orchestrator
  template:
    metadata:
      labels:
        app: dark-factory-orchestrator
        app.kubernetes.io/part-of: dark-factory
    spec:
      serviceAccountName: dark-factory-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          # Replace with the built image (ECR). Placeholder tag pinned by the
          # GitOps values/kustomize overlay at deploy time.
          image: public.ecr.aws/docker/library/node:20-alpine
          command: ["node", "server.js"]
          workingDir: /app
          env:
            - name: PORT
              value: "8080"
            - name: SANDBOX_NAMESPACE
              value: agent-sandbox-system
            - name: WARM_POOL_NAME
              value: coder-warmpool
            - name: BIFROST_URL
              value: http://bifrost.bifrost.svc.cluster.local:8080
            - name: CODER_PROFILE
              value: claude-code
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dark-factory-orchestrator
  namespace: agent-sandbox-system
  labels:
    app: dark-factory-orchestrator
    app.kubernetes.io/part-of: dark-factory
spec:
  selector:
    app: dark-factory-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: http
