# ArgoCD Application for the Dark Factory orchestrator (Flow B, P1).
#
# Deploys the orchestrator's k8s manifests onto spoke-dev ONLY. Flow B runs on
# spoke-dev exclusively (prod is never a test bed — see docs/dark-factory §10).
# The `destination.name: spoke-dev` pins it to the dev spoke; apply this on the
# hub ArgoCD (the same control plane that owns the agent-sandbox appsets).
#
# The coder image is not deployed here — it's referenced by the Flow A
# SandboxTemplate that the warm pool clones; the orchestrator only claims from
# that pool. Build + push both images (orchestrator, coder) to ECR and pin the
# tags before enabling.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dark-factory-orchestrator
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dark-factory
  annotations:
    # After the agent-sandbox capability (Flow A) is up.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/aws-samples/sample-open-agentic-platform.git
    targetRevision: dark-factory-autonomous-agent-coding-pattern
    path: examples/dark-factory/orchestrator/k8s
  destination:
    # spoke-dev only — Flow B does not run on hub or prod.
    name: spoke-dev
    namespace: agent-sandbox-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # agent-sandbox-system is owned by Flow A
      - ServerSideApply=true
