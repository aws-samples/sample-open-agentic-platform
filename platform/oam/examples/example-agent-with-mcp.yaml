apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: agent-with-tools
  namespace: default
spec:
  components:
    - name: tool-agent
      type: agent
      properties:
        description: "AI assistant with MCP tool integration"

        replicas: 3

        systemMessage: |
          You are an AI assistant with access to various tools via MCP.
          You can check weather, search the web, and perform calculations.
          Use tools when appropriate to provide accurate information.

        modelConfig:
          modelId: claude-sonnet
          llmGatewayUrl: http://bifrost.bifrost.svc.cluster.local:8080/v1

        # MCP tool servers (reached through AgentGateway)
        mcpServers:
          - name: weather-tools
          - name: web-search
          - name: calculator

        autoPromotionEnabled: true
        autoPromotionSeconds: 10
        scaleDownDelaySeconds: 30

        registerWithGateway: true

        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      traits:
        # Secretless identity to AgentGateway/MCP.
        - type: gateway-identity
