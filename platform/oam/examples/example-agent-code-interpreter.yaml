# Example: Agent with AgentCore Code Interpreter
#
# The agent can execute Python/TypeScript/JavaScript code in a secure sandboxed
# environment via AgentCore Code Interpreter. Useful for data analysis,
# calculations, generating charts, and validating logic.
#
# Flow:
#   1. agentcore-code-interpreter provisions the CodeInterpreter resource via
#      Crossplane and emits an IAM policy for accessing it.
#   2. The agent receives CODE_INTERPRETER_ID as an env var and initializes the
#      AgentCoreCodeInterpreter tool from strands-agents-tools.
#   3. The aws-service-identity trait creates the IAM role + PodIdentityAssociation
#      and attaches the code-interpreter policy via accessFor.
#
# Prerequisites:
# - Crossplane AgentCore provider deployed (crossplane-agentcore addon)
# - strands-agents-tools installed in the agent image
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: code-interpreter-agent
  namespace: default
spec:
  components:
    - name: my-code-interpreter
      type: agentcore-code-interpreter
      properties:
        region: us-east-1
        description: "Code Interpreter for data analysis agent"
        networkMode: PUBLIC

    - name: my-code-agent
      type: agent
      dependsOn:
        - my-code-interpreter
      properties:
        description: "Agent with code execution capabilities"
        replicas: 1
        systemMessage: |
          You are a data analysis assistant with code execution capabilities.
          When asked to perform calculations, analyze data, or generate visualizations,
          always write and execute Python code to provide accurate results.
          Show both the code and its output in your responses.
        modelConfig:
          modelId: claude-sonnet
        codeInterpreter:
          codeInterpreterId: "injected-from-output"
          region: us-east-1
        registerWithGateway: false
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      traits:
        - type: aws-service-identity
          properties:
            accessFor:
              - my-code-interpreter
