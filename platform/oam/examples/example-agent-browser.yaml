# Example: Agent with AgentCore Browser
#
# The agent can interact with websites in a secure cloud-based browser via
# AgentCore Browser. Useful for web research, form filling, scraping public
# data, and testing web applications.
#
# Flow:
#   1. agentcore-browser provisions the Browser resource via Crossplane and
#      emits an IAM policy for accessing it.
#   2. The agent receives BROWSER_ID as an env var and initializes the
#      AgentCoreBrowser tool from strands-agents-tools.
#   3. The aws-service-identity trait creates the IAM role + PodIdentityAssociation
#      and attaches the browser policy via accessFor.
#
# Prerequisites:
# - Crossplane AgentCore provider deployed (crossplane-agentcore addon)
# - strands-agents-tools[browser] installed in the agent image
# - nest_asyncio + playwright dependencies in the image
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: browser-agent
  namespace: default
spec:
  components:
    - name: my-browser
      type: agentcore-browser
      properties:
        region: us-east-1
        description: "Browser for web research agent"
        networkMode: PUBLIC

    - name: my-browser-agent
      type: agent
      dependsOn:
        - my-browser
      properties:
        description: "Agent with web browsing capabilities"
        replicas: 1
        systemMessage: |
          You are a web research assistant with browser capabilities.
          You can navigate websites, read content, fill forms, and extract
          information from web pages. Use the browser tools to accomplish
          tasks that require web interaction.
        modelConfig:
          modelId: claude-sonnet
        browser:
          browserId: "injected-from-output"
          region: us-east-1
        registerWithGateway: false
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      traits:
        - type: aws-service-identity
          properties:
            accessFor:
              - my-browser
