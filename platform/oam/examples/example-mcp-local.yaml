apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: mcp-time-server
  namespace: default
spec:
  components:
    - name: mcp-time
      type: mcp-server
      properties:
        name: mcp-time
        namespace: mcp-time-server
        description: "MCP server that provides current time tools"
        image: "929819487611.dkr.ecr.us-west-2.amazonaws.com/mcp-time-server:http"
        containerPort: 8000
        replicas: 1

        env:
          - name: LOCAL_TIMEZONE
            value: "UTC"

        registerWithGateway: true

        autoPromotionEnabled: true
        autoPromotionSeconds: 10
        scaleDownDelaySeconds: 30
