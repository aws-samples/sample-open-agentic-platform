# Example: Agent with decentralized observability (CloudWatch GenAI Console)
#
# In this mode, the agent exports traces directly to CloudWatch via the
# AWS Distro for OpenTelemetry (ADOT >=0.18.0, unsplit architecture).
# Spans go to the aws/spans log group automatically — no separate log group needed.
#
# Prerequisites:
# - Pod Identity on the agent's ServiceAccount with permissions:
#   logs:PutLogEvents, logs:CreateLogGroup, logs:CreateLogStream,
#   xray:PutTraceSegments, xray:PutTelemetryRecords,
#   cloudwatch:PutMetricData
#   (Provisioned automatically by the oam-agent-components chart)
# - CloudWatch Transaction Search enabled in the account (one-time setup):
#   aws xray update-trace-segment-destination --destination CloudWatchLogs
#
# View traces: CloudWatch > Application Signals > GenAI Observability
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: my-cw-agent
  namespace: default
spec:
  components:
    - name: my-cw-agent
      type: agent
      properties:
        description: "Agent with CloudWatch GenAI observability"
        replicas: 1
        systemMessage: "You are a helpful assistant."
        modelConfig:
          modelId: claude-sonnet
        # Switch to decentralized observability (CloudWatch direct)
        observability:
          mode: decentralized
        registerWithGateway: false
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      traits:
        # CloudWatch/X-Ray IAM identity for ADOT export (EKS Pod Identity).
        - type: decentralized-observability-identity
