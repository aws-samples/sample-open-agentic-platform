# Example: Full-stack agent with Memory + CodeInterpreter + Browser
#
# Combines all AgentCore capabilities into a single agent:
# - Memory: Persistent conversation context across sessions
# - CodeInterpreter: Execute code in a secure sandbox
# - Browser: Interact with websites for research
#
# This represents the most capable agent configuration on the platform.
# The agent can remember past conversations, execute code for analysis,
# and browse the web for current information.
#
# Prerequisites:
# - Crossplane AgentCore provider deployed (crossplane-agentcore addon)
# - strands-agents-tools[browser] installed in the agent image
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: full-stack-agent
  namespace: default
spec:
  components:
    # Infrastructure components — provisioned via Crossplane
    - name: agent-memory
      type: agentcore-memory
      properties:
        region: us-east-1
        description: "Memory for full-stack agent"
        eventExpiryDuration: 30

    - name: agent-code-interpreter
      type: agentcore-code-interpreter
      properties:
        region: us-east-1
        description: "Code Interpreter for full-stack agent"
        networkMode: PUBLIC

    - name: agent-browser
      type: agentcore-browser
      properties:
        region: us-east-1
        description: "Browser for full-stack agent"
        networkMode: PUBLIC

    # The agent — depends on all infrastructure components
    - name: my-full-agent
      type: agent
      dependsOn:
        - agent-memory
        - agent-code-interpreter
        - agent-browser
      properties:
        description: "Full-stack agent with memory, code execution, and web browsing"
        replicas: 1
        systemMessage: |
          You are a powerful AI assistant with three capabilities:
          1. Memory: You remember past conversations and can build on previous context.
          2. Code Interpreter: You can execute Python code for data analysis, calculations, and visualizations.
          3. Browser: You can browse the web to find current information and interact with websites.

          Use the appropriate tool for each task. Combine tools when needed — for example,
          browse the web for data, then use code interpreter to analyze it.
        modelConfig:
          modelId: claude-sonnet
        memory:
          provider: agentcore
          config:
            memoryId: "injected-from-agentcore-memory-output"
            region: us-east-1
        codeInterpreter:
          codeInterpreterId: "injected-from-output"
          region: us-east-1
        browser:
          browserId: "injected-from-output"
          region: us-east-1
        registerWithGateway: false
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      traits:
        - type: gateway-identity
        - type: aws-service-identity
          properties:
            accessFor:
              - agent-memory
              - agent-code-interpreter
              - agent-browser
