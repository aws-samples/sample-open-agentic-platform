apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: minimal-agent
  namespace: default
spec:
  components:
    # Component name is the agent identity (context.name).
    - name: simple-agent
      type: agent
      properties:
        description: "Minimal AI assistant configuration"
        # Only required field
        systemMessage: "You are a helpful AI assistant."
        # Everything else uses defaults (image, replicas, modelId=claude-sonnet,
        # llmGatewayUrl, autoPromotionEnabled, registerWithGateway).
      traits:
        # Secretless identity to AgentGateway/MCP.
        - type: gateway-identity
